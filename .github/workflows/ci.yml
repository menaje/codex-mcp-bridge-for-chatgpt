name: Release

# A main push is the explicit prerelease/stable release action for this
# repository. Development and pull-request pushes intentionally run no Actions.
on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: main-release
  cancel-in-progress: false

jobs:
  check:
    name: Check npm server runtime
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - id: metadata
        name: Read release manifest
        run: node scripts/release-manifest.mjs github-output >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.metadata.outputs.node_version }}
          cache: npm
      - run: npm install --global "npm@${{ steps.metadata.outputs.npm_version }}"
      - run: npm ci
      - name: Install supported Codex CLI
        run: npm install --global "@openai/codex@${{ steps.metadata.outputs.codex_cli_version }}"
      - name: Check App Server protocol schemas
        run: npm run app-server:compat:check
      - run: npm run check
      - run: npm audit --omit=dev

  macos-check:
    name: Check native macOS app
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - id: metadata
        name: Read release manifest
        run: node scripts/release-manifest.mjs github-output >> "$GITHUB_OUTPUT"
      - name: Verify release runner architecture
        run: test "$(uname -m)" = "${{ steps.metadata.outputs.macos_architecture }}"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.metadata.outputs.node_version }}
          cache: npm
      - run: npm install --global "npm@${{ steps.metadata.outputs.npm_version }}"
      - run: npm ci
      - name: Build and test native app bundle
        env:
          MACOS_EXPECTED_ARCHITECTURE: ${{ steps.metadata.outputs.macos_architecture }}
        run: npm run macos:bundle
      - name: Verify development app bundle signature
        run: codesign --verify --deep --strict "macos/build/Codex MCP Bridge for ChatGPT.app"

  common-release-assets:
    name: Build npm server and skills assets
    needs:
      - check
      - macos-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - id: metadata
        name: Read release manifest
        run: node scripts/release-manifest.mjs github-output >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.metadata.outputs.node_version }}
          cache: npm
      - run: npm install --global "npm@${{ steps.metadata.outputs.npm_version }}"
      - run: npm ci
      - run: npm run build
      - name: Build generic npm and skills assets
        env:
          PACKAGE_FILE: ${{ steps.metadata.outputs.package_filename }}
          CHECKSUM_FILE: ${{ steps.metadata.outputs.checksum_filename }}
          SKILLS_FILE: ${{ steps.metadata.outputs.skills_archive_filename }}
        run: |
          mkdir -p release-assets
          pack_json="$(npm pack --json --pack-destination release-assets)"
          package_file="$(node -e 'const fs = require("node:fs"); const value = JSON.parse(fs.readFileSync(0, "utf8")); if (!Array.isArray(value) || value.length !== 1 || typeof value[0].filename !== "string") process.exit(1); process.stdout.write(value[0].filename);' <<< "$pack_json")"
          if [[ "$package_file" != "$PACKAGE_FILE" ]]; then
            echo "npm produced $package_file instead of $PACKAGE_FILE." >&2
            exit 1
          fi
          (
            cd release-assets
            sha256sum "$PACKAGE_FILE" > "$CHECKSUM_FILE"
          )
          npm run skills:package -- --output "release-assets/$SKILLS_FILE"
      - uses: actions/upload-artifact@v7
        with:
          name: common-release-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  macos-release-package:
    name: Package unnotarized macOS arm64 app
    needs:
      - check
      - macos-check
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - id: metadata
        name: Read release manifest
        run: node scripts/release-manifest.mjs github-output >> "$GITHUB_OUTPUT"
      - name: Verify release runner architecture
        run: test "$(uname -m)" = "${{ steps.metadata.outputs.macos_architecture }}"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.metadata.outputs.node_version }}
          cache: npm
      - run: npm install --global "npm@${{ steps.metadata.outputs.npm_version }}"
      - run: npm ci
      - name: Build and ad-hoc sign unnotarized release DMG
        env:
          MACOS_BUNDLE_VERSION: ${{ github.run_number }}
          MACOS_EXPECTED_ARCHITECTURE: ${{ steps.metadata.outputs.macos_architecture }}
          MACOS_FILE: ${{ steps.metadata.outputs.macos_archive_filename }}
        run: |
          mkdir -p release-assets
          npm run macos:package -- --output "release-assets/$MACOS_FILE"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-release-asset
          path: release-assets/${{ steps.metadata.outputs.macos_archive_filename }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish package version
    needs:
      - check
      - macos-check
      - common-release-assets
      - macos-release-package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: metadata
        name: Read release manifest
        run: node scripts/release-manifest.mjs github-output >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.metadata.outputs.node_version }}
      - id: release-state
        name: Validate release target
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_REPOSITORY: ${{ steps.metadata.outputs.repository }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          if [[ "$GITHUB_REPOSITORY" != "$EXPECTED_REPOSITORY" ]]; then
            echo "Manifest repository $EXPECTED_REPOSITORY does not match workflow repository $GITHUB_REPOSITORY." >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $RELEASE_TAG already exists; no duplicate release will be created."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            if git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG" >/dev/null; then
              tag_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
              if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
                echo "Tag $RELEASE_TAG already points to $tag_commit instead of $GITHUB_SHA." >&2
                exit 1
              fi
              echo "tag_exists=true" >> "$GITHUB_OUTPUT"
            else
              echo "tag_exists=false" >> "$GITHUB_OUTPUT"
            fi
          fi
      - if: steps.release-state.outputs.exists != 'true'
        uses: actions/download-artifact@v8
        with:
          name: macos-release-asset
          path: release-assets
      - if: steps.release-state.outputs.exists != 'true'
        uses: actions/download-artifact@v8
        with:
          name: common-release-assets
          path: release-assets
      - if: steps.release-state.outputs.exists != 'true'
        name: Verify the complete release set and write aggregate checksums
        run: |
          npm run release:assets -- write --directory release-assets
          npm run release:assets -- check --directory release-assets
      - if: steps.release-state.outputs.exists != 'true'
        name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          RELEASE_TITLE: ${{ steps.metadata.outputs.release_title }}
          RELEASE_CHANNEL: ${{ steps.metadata.outputs.channel }}
          GENERATE_NOTES: ${{ steps.metadata.outputs.generate_notes }}
          PACKAGE_FILE: ${{ steps.metadata.outputs.package_filename }}
          CHECKSUM_FILE: ${{ steps.metadata.outputs.checksum_filename }}
          SKILLS_FILE: ${{ steps.metadata.outputs.skills_archive_filename }}
          MACOS_FILE: ${{ steps.metadata.outputs.macos_archive_filename }}
          RELEASE_CHECKSUMS_FILE: ${{ steps.metadata.outputs.release_checksums_filename }}
          TAG_EXISTS: ${{ steps.release-state.outputs.tag_exists }}
        run: |
          release_args=(
            "$RELEASE_TAG"
            "release-assets/$MACOS_FILE#macOS arm64 app (ad-hoc signed, not notarized DMG)"
            "release-assets/$PACKAGE_FILE#generic npm server package"
            "release-assets/$CHECKSUM_FILE#npm package SHA-256"
            "release-assets/$SKILLS_FILE#installable Codex skills"
            "release-assets/$RELEASE_CHECKSUMS_FILE#all release SHA-256 checksums"
            --title "$RELEASE_TITLE"
            --notes "The macOS arm64 app is ad-hoc signed and not Apple-notarized. Approve only this app in System Settings > Privacy & Security if first launch is blocked; do not disable Gatekeeper globally. The npm archive remains available for users who choose to run the existing server directly in their own Node.js environment."
          )
          if [[ "$GENERATE_NOTES" == "true" ]]; then
            release_args+=(--generate-notes)
          fi
          if [[ "$RELEASE_CHANNEL" == "prerelease" ]]; then
            release_args+=(--prerelease)
          fi
          if [[ "$TAG_EXISTS" == "true" ]]; then
            release_args+=(--verify-tag)
          else
            release_args+=(--target "$GITHUB_SHA")
          fi
          gh release create "${release_args[@]}"
