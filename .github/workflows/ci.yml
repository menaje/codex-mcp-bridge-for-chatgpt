name: CI and Release

on:
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: main-ci-release
  cancel-in-progress: false

jobs:
  check:
    name: Check Node runtime
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - id: metadata
        name: Read release manifest
        run: node scripts/release-manifest.mjs github-output >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.metadata.outputs.node_version }}
          cache: npm
      - run: npm install --global "npm@${{ steps.metadata.outputs.npm_version }}"
      - run: npm ci
      - name: Install supported Codex CLI
        run: npm install --global "@openai/codex@${{ steps.metadata.outputs.codex_cli_version }}"
      - name: Check App Server protocol schemas
        run: npm run app-server:compat:check
      - run: npm run check
      - run: npm audit --omit=dev

  macos-check:
    name: Check native macOS app
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - id: metadata
        name: Read release manifest
        run: node scripts/release-manifest.mjs github-output >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.metadata.outputs.node_version }}
          cache: npm
      - run: npm install --global "npm@${{ steps.metadata.outputs.npm_version }}"
      - run: npm ci
      - name: Build and test native app bundle
        run: npm run macos:bundle
      - name: Verify app bundle signature
        run: codesign --verify --deep --strict "macos/build/Codex MCP Bridge for ChatGPT.app"

  release:
    name: Release package version
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - check
      - macos-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: metadata
        name: Read release manifest
        run: node scripts/release-manifest.mjs github-output >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.metadata.outputs.node_version }}
          cache: npm
      - id: release-state
        name: Validate release target
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_REPOSITORY: ${{ steps.metadata.outputs.repository }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          if [[ "$GITHUB_REPOSITORY" != "$EXPECTED_REPOSITORY" ]]; then
            echo "Manifest repository $EXPECTED_REPOSITORY does not match workflow repository $GITHUB_REPOSITORY." >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $RELEASE_TAG already exists; no duplicate release will be created."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            if git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG" >/dev/null; then
              tag_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
              if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
                echo "Tag $RELEASE_TAG already points to $tag_commit instead of $GITHUB_SHA." >&2
                exit 1
              fi
              echo "tag_exists=true" >> "$GITHUB_OUTPUT"
            else
              echo "tag_exists=false" >> "$GITHUB_OUTPUT"
            fi
          fi
      - if: steps.release-state.outputs.exists != 'true'
        run: npm install --global "npm@${{ steps.metadata.outputs.npm_version }}"
      - if: steps.release-state.outputs.exists != 'true'
        run: npm ci
      - if: steps.release-state.outputs.exists != 'true'
        run: npm run build
      - if: steps.release-state.outputs.exists != 'true'
        id: package
        name: Build release assets
        env:
          EXPECTED_PACKAGE_FILE: ${{ steps.metadata.outputs.package_filename }}
          EXPECTED_CHECKSUM_FILE: ${{ steps.metadata.outputs.checksum_filename }}
          EXPECTED_SKILLS_FILE: ${{ steps.metadata.outputs.skills_archive_filename }}
        run: |
          pack_json="$(npm pack --json)"
          package_file="$(node -e 'const fs = require("node:fs"); const packed = JSON.parse(fs.readFileSync(0, "utf8")); if (!Array.isArray(packed) || packed.length !== 1 || typeof packed[0].filename !== "string") process.exit(1); process.stdout.write(packed[0].filename);' <<< "$pack_json")"
          if [[ "$package_file" != "$EXPECTED_PACKAGE_FILE" ]]; then
            echo "npm produced $package_file instead of manifest asset $EXPECTED_PACKAGE_FILE." >&2
            exit 1
          fi
          checksum_file="$package_file.sha256"
          if [[ "$checksum_file" != "$EXPECTED_CHECKSUM_FILE" ]]; then
            echo "Checksum filename $checksum_file does not match manifest asset $EXPECTED_CHECKSUM_FILE." >&2
            exit 1
          fi
          sha256sum "$package_file" > "$checksum_file"
          skills_file="$EXPECTED_SKILLS_FILE"
          npm run skills:package -- --output "$skills_file"
          if [[ ! -f "$skills_file" ]]; then
            echo "Skills release archive $skills_file was not created." >&2
            exit 1
          fi
          echo "package_file=$package_file" >> "$GITHUB_OUTPUT"
          echo "checksum_file=$checksum_file" >> "$GITHUB_OUTPUT"
          echo "skills_file=$skills_file" >> "$GITHUB_OUTPUT"
      - if: steps.release-state.outputs.exists != 'true'
        name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          RELEASE_TITLE: ${{ steps.metadata.outputs.release_title }}
          RELEASE_CHANNEL: ${{ steps.metadata.outputs.channel }}
          GENERATE_NOTES: ${{ steps.metadata.outputs.generate_notes }}
          PACKAGE_FILE: ${{ steps.package.outputs.package_file }}
          CHECKSUM_FILE: ${{ steps.package.outputs.checksum_file }}
          SKILLS_FILE: ${{ steps.package.outputs.skills_file }}
          TAG_EXISTS: ${{ steps.release-state.outputs.tag_exists }}
        run: |
          release_args=(
            "$RELEASE_TAG"
            "$PACKAGE_FILE#npm package"
            "$CHECKSUM_FILE#SHA-256 checksum"
            "$SKILLS_FILE#installable Codex skills"
            --title "$RELEASE_TITLE"
          )

          if [[ "$GENERATE_NOTES" == "true" ]]; then
            release_args+=(--generate-notes)
          else
            release_args+=(--notes "Automated release from $GITHUB_SHA")
          fi
          if [[ "$RELEASE_CHANNEL" == "prerelease" ]]; then
            release_args+=(--prerelease)
          fi
          if [[ "$TAG_EXISTS" == "true" ]]; then
            release_args+=(--verify-tag)
          else
            release_args+=(--target "$GITHUB_SHA")
          fi

          gh release create "${release_args[@]}"
