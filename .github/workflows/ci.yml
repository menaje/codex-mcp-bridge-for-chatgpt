name: Main CI and Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: main-ci-release
  cancel-in-progress: false

jobs:
  check:
    name: Check main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@10.9.3
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev

  release:
    name: Release package version
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - id: metadata
        name: Resolve release version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid package version: $version" >&2
            exit 1
          fi

          tag="v${version}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $tag already exists; no duplicate release will be created."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
              tag_commit="$(git rev-list -n 1 "$tag")"
              if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
                echo "Tag $tag already points to $tag_commit instead of $GITHUB_SHA." >&2
                exit 1
              fi
              echo "tag_exists=true" >> "$GITHUB_OUTPUT"
            else
              echo "tag_exists=false" >> "$GITHUB_OUTPUT"
            fi
          fi
      - if: steps.metadata.outputs.exists != 'true'
        run: npm install --global npm@10.9.3
      - if: steps.metadata.outputs.exists != 'true'
        run: npm ci
      - if: steps.metadata.outputs.exists != 'true'
        run: npm run build
      - if: steps.metadata.outputs.exists != 'true'
        id: package
        name: Build release assets
        run: |
          pack_json="$(npm pack --json)"
          package_file="$(node -e 'const fs = require("node:fs"); const packed = JSON.parse(fs.readFileSync(0, "utf8")); if (!Array.isArray(packed) || packed.length !== 1 || typeof packed[0].filename !== "string") process.exit(1); process.stdout.write(packed[0].filename);' <<< "$pack_json")"
          sha256sum "$package_file" > "$package_file.sha256"
          echo "package_file=$package_file" >> "$GITHUB_OUTPUT"
          echo "checksum_file=$package_file.sha256" >> "$GITHUB_OUTPUT"
      - if: steps.metadata.outputs.exists != 'true'
        name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          PACKAGE_FILE: ${{ steps.package.outputs.package_file }}
          CHECKSUM_FILE: ${{ steps.package.outputs.checksum_file }}
          TAG_EXISTS: ${{ steps.metadata.outputs.tag_exists }}
        run: |
          release_args=(
            "$RELEASE_TAG"
            "$PACKAGE_FILE#npm package"
            "$CHECKSUM_FILE#SHA-256 checksum"
            --title "$RELEASE_TAG"
            --generate-notes
          )

          if [[ "$TAG_EXISTS" == "true" ]]; then
            release_args+=(--verify-tag)
          else
            release_args+=(--target "$GITHUB_SHA")
          fi

          gh release create "${release_args[@]}"
