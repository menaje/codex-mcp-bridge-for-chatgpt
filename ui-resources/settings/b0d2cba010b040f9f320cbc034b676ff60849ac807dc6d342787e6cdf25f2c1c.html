<!doctype html>
<html lang="en" dir="auto">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Codex MCP Bridge for ChatGPT</title>
  <style>
    :root { color-scheme: light dark; font-family: ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; --surface:color-mix(in srgb,Canvas 96%,CanvasText 4%); --muted:color-mix(in srgb,CanvasText 62%,transparent); --border:color-mix(in srgb,CanvasText 16%,transparent); --accent:#1777ff; --success:#16803a; --warning:#b87503; --danger:#c34132; }
    * { box-sizing:border-box; } body { margin:0; padding:12px; background:transparent; color:CanvasText; }
    .card { border:1px solid var(--border); border-radius:16px; background:var(--surface); padding:16px; }
    header { display:flex; gap:12px; justify-content:space-between; align-items:start; margin-bottom:14px; }
    h1 { font-size:18px; line-height:1.3; margin:0; } .scope,.hint { font-size:11px; line-height:1.45; color:var(--muted); font-weight:400; }
    .scope { margin:4px 0 0; font-size:12px; }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; } .wide { grid-column:1/-1; }
    label { display:grid; gap:6px; font-size:12px; font-weight:650; }
    select,input { width:100%; min-height:38px; border:1px solid var(--border); border-radius:10px; background:Canvas; color:CanvasText; padding:8px 10px; font:inherit; }
    input[type="checkbox"] { width:auto; min-height:auto; padding:0; accent-color:var(--accent); }
    .policy-panel { border:1px solid var(--border); border-radius:12px; padding:12px; }
    .policy-panel[hidden] { display:none; }
    .checkline { display:flex; align-items:center; gap:8px; font-weight:600; }
    .selection-list { display:grid; gap:7px; max-height:240px; overflow:auto; padding:8px; border:1px solid var(--border); border-radius:10px; }
    .selection-list .checkline { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; }
    .explicit-layout { display:grid; grid-template-columns:minmax(180px,.7fr) minmax(260px,1.3fr); gap:10px; margin-top:8px; }
    .choice-group { min-width:0; margin:0; padding:0; border:0; }
    .choice-group > legend { margin-bottom:6px; padding:0; }
    .effort-groups { display:grid; gap:8px; }
    .effort-card { display:grid; min-width:0; margin:0; gap:8px; padding:10px; border:1px solid var(--border); border-radius:10px; }
    .effort-card-header { display:flex; align-items:center; justify-content:flex-end; gap:8px; }
    .effort-card-title { min-width:0; font:650 12px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace; overflow-wrap:anywhere; }
    .effort-options { display:flex; flex-wrap:wrap; gap:7px 12px; }
    .effort-options .checkline { font-size:11px; }
    .selection-count { margin-top:8px; text-align:right; }
    .projects-panel { border:1px solid var(--border); border-radius:12px; padding:12px; }
    .projects-header { display:flex; align-items:start; justify-content:space-between; gap:12px; }
    .projects-header h2 { margin:0 0 4px; font-size:14px; }
    .project-list { display:grid; gap:9px; margin-top:10px; }
    .project-row { display:grid; grid-template-columns:minmax(160px,.8fr) minmax(240px,1.4fr) auto; gap:8px; align-items:end; padding:10px; border:1px solid var(--border); border-radius:10px; }
    .project-row.unavailable { border-color:color-mix(in srgb,var(--danger) 45%,transparent); }
    .project-row[data-state="archive"] { border-color:color-mix(in srgb,var(--warning) 58%,var(--border)); background:color-mix(in srgb,var(--warning) 8%,transparent); }
    .project-row[data-state="restore"] { border-color:color-mix(in srgb,var(--success) 58%,var(--border)); background:color-mix(in srgb,var(--success) 8%,transparent); }
    .project-row[data-state="delete"] { border-color:color-mix(in srgb,var(--danger) 65%,var(--border)); background:color-mix(in srgb,var(--danger) 10%,transparent); }
    .project-row[data-state="delete"] > label { opacity:.48; }
    .project-row label { min-width:0; }
    .project-row-actions { display:grid; gap:6px; justify-items:end; }
    .project-availability { font-size:10px; color:var(--muted); white-space:nowrap; }
    .project-availability.unavailable { color:var(--danger); font-weight:650; }
    .project-pending-message { grid-column:1/-1; margin:2px 0 0; padding:8px 10px; border-radius:8px; font-size:12px; line-height:1.45; font-weight:700; }
    .project-row[data-state="archive"] .project-pending-message { color:var(--warning); background:color-mix(in srgb,var(--warning) 12%,transparent); }
    .project-row[data-state="restore"] .project-pending-message { color:var(--success); background:color-mix(in srgb,var(--success) 12%,transparent); }
    .project-row[data-state="delete"] .project-pending-message { color:var(--danger); background:color-mix(in srgb,var(--danger) 14%,transparent); }
    .project-delete-confirm { grid-column:1/-1; display:grid; gap:9px; padding:10px; border:1px solid color-mix(in srgb,var(--danger) 48%,var(--border)); border-radius:9px; background:color-mix(in srgb,var(--danger) 8%,Canvas); color:CanvasText; font-size:12px; line-height:1.5; }
    .project-delete-confirm[hidden],.project-pending-message[hidden] { display:none; }
    .project-delete-confirm-message { margin:0; }
    .project-delete-confirm-actions { display:flex; flex-wrap:wrap; justify-content:flex-end; gap:7px; }
    .project-delete-confirm-accept { border-color:var(--danger); background:var(--danger); color:white; }
    .project-remove,.project-delete { color:var(--danger); }
    .no-projects { margin:10px 0 0; padding:12px; border:1px solid color-mix(in srgb,var(--accent) 35%,var(--border)); border-radius:10px; background:color-mix(in srgb,var(--accent) 7%,transparent); font-size:12px; line-height:1.5; }
    .field-error { display:none; margin:8px 0 0; color:var(--danger); font-size:12px; line-height:1.4; }
    .field-error.show { display:block; }
    .notice { margin-top:12px; padding:10px; border:1px solid var(--border); border-radius:10px; font-size:12px; color:var(--muted); line-height:1.45; }
    .experimental-notice { margin:0 0 14px; border-color:color-mix(in srgb,var(--danger) 45%,transparent); color:var(--danger); }
    .catalog-status { display:flex; align-items:center; gap:7px; margin:0 0 14px; padding:8px 10px; border:1px solid var(--border); border-radius:10px; font-size:12px; line-height:1.4; }
    .catalog-status::before { content:""; width:8px; height:8px; flex:0 0 8px; border-radius:50%; background:var(--muted); }
    .catalog-status[data-state="valid"] { border-color:color-mix(in srgb,var(--success) 45%,var(--border)); color:var(--success); }
    .catalog-status[data-state="valid"]::before { background:var(--success); }
    .catalog-status[data-state="temporarily-unverified-with-last-known-good"] { border-color:color-mix(in srgb,var(--accent) 45%,var(--border)); color:var(--accent); }
    .catalog-status[data-state="temporarily-unverified-with-last-known-good"]::before { background:var(--accent); }
    .catalog-status[data-state="invalid"] { border-color:color-mix(in srgb,var(--danger) 45%,var(--border)); color:var(--danger); }
    .catalog-status[data-state="invalid"]::before { background:var(--danger); }
    .catalog-status-source { margin-left:auto; color:var(--muted); font:11px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace; overflow-wrap:anywhere; }
    .inline-warning { color:var(--danger); }
    .warning { display:none; margin-top:12px; border:1px solid color-mix(in srgb,var(--danger) 45%,transparent); border-radius:10px; padding:10px; color:var(--danger); font-size:12px; line-height:1.45; white-space:pre-line; }
    .warning.show { display:block; } .warning button { margin-top:8px; } .access-warning { margin-top:2px; }
    .loading-status { margin:0; text-align:center; }
    .loading-status.error { border-color:color-mix(in srgb,var(--danger) 45%,var(--border)); color:var(--danger); }
    .actions { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:16px; }
    button { min-height:36px; border:1px solid var(--border); border-radius:10px; padding:7px 12px; background:Canvas; color:CanvasText; font-weight:650; cursor:pointer; }
    button.primary { border-color:var(--accent); background:var(--accent); color:white; } button.primary.project-changes-pending { box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 24%,transparent); } button:disabled { cursor:wait; opacity:.6; }
    #status { flex:1; min-width:180px; font-size:12px; color:var(--muted); text-align:right; } #status.error { color:var(--danger); }
    @media (max-width:700px) { .project-row{grid-template-columns:1fr 1fr}.project-row-actions{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;width:100%} }
    @media (max-width:560px) { .grid,.explicit-layout,.project-row{grid-template-columns:1fr}.wide{grid-column:auto}.projects-header{display:grid}.project-row-actions{grid-column:auto}#status{text-align:left} }
  </style>
</head>
<body>
  <main class="card">
    <header><div><h1>Codex MCP Bridge for ChatGPT</h1><p class="scope" data-i18n="settings.scope"></p></div></header>
    <aside class="notice experimental-notice" data-i18n="settings.appServerExperimental"></aside>
    <div class="catalog-status" id="catalog-status" role="status" aria-live="polite" data-state="invalid" hidden><span id="catalog-status-label"></span><span class="catalog-status-source" id="catalog-status-source"></span></div>
    <div class="notice loading-status" id="settings-loading" role="status" aria-live="polite" data-i18n="common.loading"></div>
    <form id="settings-form" hidden>
      <div class="grid">
        <label class="wide"><span data-i18n="settings.access"></span><select id="access-strategy" aria-describedby="access-hint full-warning"></select><span class="hint" id="access-hint"></span><span class="warning access-warning" id="full-warning" role="status" aria-live="polite" aria-atomic="true" data-i18n="settings.fullWarning"></span></label>
        <label class="wide"><span data-i18n="settings.modelPolicy"></span><select id="model-policy-mode"><option value="fixed" data-i18n="settings.modelPolicy.fixed"></option><option value="automatic" data-i18n="settings.modelPolicy.automatic"></option></select></label>
        <label class="wide checkline"><input id="allow-delegation" type="checkbox" /><span data-i18n="settings.allowDelegation"></span></label>
        <div class="wide"><label class="checkline"><input id="use-priority-service-tier" type="checkbox" /><span data-i18n="settings.usePriority"></span></label><span class="hint" data-i18n="settings.usePriorityHint"></span></div>
        <section class="wide policy-panel" id="fixed-policy-panel">
          <div class="grid">
            <label><span data-i18n="settings.model"></span><select id="policy-model" required></select><span class="hint" data-i18n="settings.modelHint"></span></label>
            <label><span data-i18n="settings.effort"></span><select id="policy-effort" required aria-describedby="effort-description effort-compatibility"></select><span class="hint" id="effort-description" aria-live="polite"></span><span class="hint inline-warning" id="effort-compatibility"></span></label>
          </div>
          <div class="notice" data-i18n="settings.fixedNotice"></div>
        </section>
        <section class="wide policy-panel" id="automatic-policy-panel" hidden>
          <div class="grid">
            <label class="wide"><span data-i18n="settings.allowedScope"></span><select id="allowed-scope"><option value="catalog-visible" data-i18n="settings.allowedScope.catalog"></option><option value="explicit" data-i18n="settings.allowedScope.explicit"></option></select></label>
            <div class="wide" id="explicit-selection-panel" hidden>
              <div class="hint" data-i18n="settings.allowedExactSelections"></div>
              <div class="explicit-layout">
                <fieldset class="choice-group"><legend class="hint" data-i18n="settings.allowedModels"></legend><div class="selection-list" id="allowed-models"></div></fieldset>
                <div><div class="hint" data-i18n="settings.effortsByModel"></div><div class="effort-groups" id="effort-groups"></div></div>
              </div>
              <div class="hint selection-count" id="selection-count" aria-live="polite"></div>
            </div>
          </div>
          <div class="notice" data-i18n="settings.automaticNotice"></div>
        </section>
        <section class="wide projects-panel" aria-labelledby="projects-title">
          <div class="projects-header"><div><h2 id="projects-title" data-i18n="settings.projects"></h2><div class="hint" data-i18n="settings.projectsHint"></div></div><button id="add-project" type="button" data-i18n="settings.addProject"></button></div>
          <div class="project-list" id="project-list"></div>
          <p class="no-projects" id="no-projects" data-i18n="settings.noProjects"></p>
          <p class="field-error" id="project-error" role="alert" aria-live="polite"></p>
        </section>
        <div class="wide"><label class="checkline"><input id="show-bridge-threads-in-codex-app" type="checkbox" /><span data-i18n="settings.codexAppThreads"></span></label><span class="hint" id="codex-app-threads-hint"></span></div>
        <label><span data-i18n="settings.language"></span><select id="ui-language"></select><span class="hint" data-i18n="settings.languageHint"></span></label>
        <label><span data-i18n="settings.concurrency"></span><input id="concurrency" type="number" min="1" step="1" required /></label>
        <label><span data-i18n="settings.cardVisibility"></span><select id="activity-card-visibility"><option value="always" data-i18n="settings.cardVisibility.always"></option><option value="background-only" data-i18n="settings.cardVisibility.background"></option><option value="never" data-i18n="settings.cardVisibility.never"></option></select></label>
        <label><span data-i18n="settings.handoff"></span><select id="completion-handoff"><option value="off" data-i18n="settings.handoff.off"></option><option value="auto-handoff" data-i18n="settings.handoff.auto"></option></select><span class="hint" id="handoff-hint"></span></label>
      </div>
      <div class="warning" id="catalog-warning" role="status" aria-live="polite"><span id="catalog-warning-text"></span><br /><button id="retry-models" type="button" data-i18n="settings.refreshModels" hidden></button></div>
      <div class="actions"><button class="primary" id="save" type="submit" data-i18n="settings.save"></button><button id="reset" type="button" data-i18n="settings.reset"></button><span id="status" role="status" aria-live="polite"></span></div>
      <div class="hint" data-i18n="settings.resetHint"></div>
    </form>
  </main>
  <script>
    const BUNDLES = {"en":{"common.loading":"Loading…","common.refresh":"Refresh","common.cancel":"Cancel","common.confirm":"Confirm","common.error":"The request failed.","common.errorCode":"The request failed ({code}).","settings.title":"Codex Bridge settings","settings.scope":"Shared by every conversation using this bridge connection.","settings.access":"Access strategy","settings.access.readOnly":"Always read-only","settings.access.adaptive":"GPT chooses per task","settings.access.full":"Always full access","settings.access.readOnlyHint":"Every new task is forced to read-only.","settings.access.adaptiveHint":"GPT may choose read-only, workspace write, or full access within the allowed limits.","settings.access.fullHint":"Every new task is forced to danger-full-access.","settings.fullWarning":"Full access runs Codex with this macOS user's filesystem and network permissions. A project folder selects where work starts; it is not OS isolation.","settings.modelPolicy":"Execution model policy","settings.modelPolicy.fixed":"Fixed","settings.modelPolicy.automatic":"Automatic selection","settings.allowDelegation":"Allow Ultra reasoning and subagent delegation","settings.model":"Model","settings.modelDefault":"Codex default model","settings.modelHint":"Exact identifier from the active backend catalog.","settings.savedModel":"currently saved","settings.effort":"Reasoning effort","settings.effortDefault":"Model default effort","settings.effortHint":"Only values supported by the selected model are shown.","settings.effortFallbackDescription":"A newly available reasoning level. Availability and behavior come from the current Codex model catalog.","settings.unsupportedEffort":"The saved reasoning level is no longer supported. Suggested model default:","effort.minimal.label":"Minimal","effort.minimal.description":"Fastest responses with only essential reasoning.","effort.low.label":"Low","effort.low.description":"Quick responses with lighter reasoning.","effort.medium.label":"Medium","effort.medium.description":"Balanced reasoning depth and response time.","effort.high.label":"High","effort.high.description":"Deeper review for complex work with a longer response time.","effort.xhigh.label":"Extra high","effort.xhigh.description":"Very deep reasoning for difficult tasks; responses can take substantially longer.","effort.max.label":"Maximum","effort.max.description":"Maximum available reasoning depth for demanding work.","effort.ultra.label":"Ultra","effort.ultra.description":"Extended reasoning and delegation for the most demanding work.","settings.serviceTier":"Service tier","settings.serviceTier.default":"Backend default tier","settings.usePriority":"Use Priority (Fast processing)","settings.usePriorityHint":"Applied privately by the bridge when Codex is called. GPT selects only the model and reasoning effort.","settings.fixedNotice":"This exact selection is enforced for Codex turns admitted after saving. An already active turn keeps its admission-time decision.","settings.allowedScope":"GPT selection range","settings.allowedScope.catalog":"All available models and efforts","settings.allowedScope.explicit":"Only models and efforts I choose","settings.allowedExactSelections":"Select models first, then choose the reasoning efforts allowed for each model.","settings.allowedModels":"Models","settings.effortsByModel":"Reasoning efforts by selected model","settings.selectAllEfforts":"All","settings.partialEffortsSelected":"Some efforts are selected.","settings.additionalServiceTiers":"Additional service-tier variants","settings.selectionCount":"{count} exact selections","settings.preferredSelection":"Default selection when GPT does not choose","settings.preferredModel":"Default model when GPT does not choose","settings.preferredEffort":"Default reasoning effort when GPT does not choose","settings.preferred.none":"Use the Codex default when GPT does not choose","settings.automaticNotice":"GPT must explicitly choose one exact model and reasoning effort from this range for every new Activity, new Agent, or fresh context. Continue and fork inherit the retained thread when selection is omitted. Priority is applied separately by the bridge. Choosing all available models and efforts automatically includes newly added options.","settings.catalogStatus.valid":"Model catalog valid","settings.catalogStatus.lastKnownGood":"Model catalog using last known good data","settings.catalogStatus.invalid":"Model catalog unavailable","settings.catalogSource":"Source: {source}","settings.selectionRequired":"Choose an exact model and reasoning effort.","settings.explicitRequired":"Select at least one allowed exact selection.","settings.modelEffortRequired":"Choose at least one reasoning effort for {model}.","settings.projects":"Projects","settings.projectsHint":"Register the folders where Codex may start work. You can add multiple unrelated locations on this PC; internal routing IDs are managed automatically.","settings.allowedRoots":"Bridge-allowed roots","settings.allowedRootsHint":"Projects must resolve inside one of these security ceilings. Registering a project cannot widen them.","settings.addProject":"Add project","settings.addFirstProject":"Register first project","settings.noProjects":"Register a project first. Codex needs a folder where it can start work, and you may add multiple folders from different locations on this PC.","settings.projectLabel":"Project name","settings.projectCwd":"Absolute folder","settings.projectAvailable":"Available","settings.projectUnavailable":"Needs recovery","settings.projectNew":"New","settings.archiveProject":"Archive","settings.restoreProject":"Restore","settings.removeProject":"Remove","settings.deleteProject":"Delete","settings.cancelDeleteProject":"Cancel deletion","settings.deleteProjectConfirm":"Mark this project registration for deletion? It will be removed from bridge tracking when you save. The folder, files, and existing work history will remain. You can cancel before saving; after it is saved, the registration cannot be restored.","settings.projectArchived":"Archived","settings.projectArchivePending":"Press Save to archive this project.","settings.projectRestorePending":"Press Save to restore this project.","settings.projectDeletePending":"Press Save to delete this project registration.","settings.projectInvalidLabel":"Enter 1–120 printable Unicode characters for the project name.","settings.projectInvalidCwd":"Enter an existing absolute folder path.","settings.projectDuplicatePath":"Each project must use a different canonical folder.","settings.projectUnavailableSave":"Fix or archive every project that needs recovery before saving.","settings.projectLimit":"At most 100 projects can be registered.","settings.projectError":"Review the Projects section and correct the highlighted values.","settings.language":"Interface language","settings.language.auto":"Automatic","settings.languageHint":"Automatic follows the host application's language.","settings.concurrency":"Maximum concurrent jobs","settings.codexAppThreads":"Show bridge threads in the Codex app","settings.codexAppThreadsHint":"Applies to new and forked App Server threads. Turning this off keeps them in memory only: they will not appear in the Codex app and cannot be resumed after the App Server worker or bridge restarts. Existing threads are unchanged.","settings.codexAppThreadsMcpHint":"Saved for App Server use. The current MCP Server backend cannot hide its threads; switch the bridge backend to App Server and restart to apply this to new and forked threads.","settings.cardVisibility":"Activity card","settings.cardVisibility.always":"Automatically show for all Codex work","settings.cardVisibility.background":"Automatically show only for background Codex work","settings.cardVisibility.never":"Do not show automatically","settings.handoff":"Completion handoff","settings.handoff.off":"Off","settings.handoff.auto":"Automatic GPT handoff while card is open","settings.handoffRequiresCard
