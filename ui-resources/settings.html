t;font-size:12px;line-height:1.5;} .project-delete-confirm[hidden],.project-pending-message[hidden] {display:none;} .project-delete-confirm-message {margin:0;} .project-delete-confirm-actions {display:flex;flex-wrap:wrap;justify-content:flex-end;gap:7px;} .project-delete-confirm-accept {border-color:var(--danger);background:var(--danger);color:white;} .project-remove,.project-delete {color:var(--danger);} .no-projects {margin:10px 0 0;padding:12px;border:1px solid color-mix(in srgb,var(--accent) 35%,var(--border));border-radius:8px;background:color-mix(in srgb,var(--accent) 7%,transparent);font-size:12px;line-height:1.5;} .field-error {display:none;margin:8px 0 0;color:var(--danger);font-size:12px;line-height:1.4;} .field-error.show {display:block;} .experimental-notice {margin:0 0 14px;border-color:color-mix(in srgb,var(--danger) 45%,transparent);color:var(--danger);} .catalog-status {display:flex;align-items:center;gap:7px;margin:0 0 14px;padding:8px 10px;border:1px solid var(--border);border-radius:9px;background:var(--faint);font-size:12px;line-height:1.4;} .catalog-status::before {content:"";width:8px;height:8px;flex:0 0 8px;border-radius:50%;background:var(--muted);} .catalog-status[data-state="valid"] {border-color:color-mix(in srgb,var(--success) 45%,var(--border));color:var(--success);} .catalog-status[data-state="valid"]::before {background:var(--success);} .catalog-status[data-state="temporarily-unverified-with-last-known-good"] {border-color:color-mix(in srgb,var(--accent) 45%,var(--border));color:var(--accent);} .catalog-status[data-state="temporarily-unverified-with-last-known-good"]::before {background:var(--accent);} .catalog-status[data-state="invalid"] {border-color:color-mix(in srgb,var(--danger) 45%,var(--border));color:var(--danger);} .catalog-status[data-state="invalid"]::before {background:var(--danger);} .inline-warning {color:var(--danger);} .warning {display:none;margin-top:12px;border:1px solid color-mix(in srgb,var(--danger) 45%,transpare <body>
  <main class="card">
    <header><div><h1>Codex MCP Bridge for ChatGPT</h1><p class="scope" data-i18n="settings.scope"></p></div></header>
    <div class="catalog-status" id="catalog-status" role="status" aria-live="polite" data-state="invalid" hidden><span id="catalog-status-label"></span></div>
    <div class="notice loading-status" id="settings-loading" role="status" aria-live="polite" data-i18n="common.loading"></div>
    <button id="retry-load" type="button" hidden data-i18n="common.refresh"></button>
    <form id="settings-form" hidden>
      <div class="grid">
        <label class="wide"><span data-i18n="settings.access"></span><select id="access-strategy" aria-describedby="access-hint full-warning"></select><span class="hint" id="access-hint"></span><span class="warning access-warning" id="full-warning" role="status" aria-live="polite" aria-atomic="true" data-i18n="settings.fullWarning"></span></label>
        <label class="wide"><span data-i18n="settings.modelPolicy"></span><select id="model-policy-mode"><option value="fixed" data-i18n="settings.modelPolicy.fixed"></option><option value="automatic" data-i18n="settings.modelPolicy.automatic"></option></select></label>
        <div class="wide"><label class="checkline"><input id="allow-delegation" type="checkbox" aria-describedby="ultra-hint ultra-policy-warning" /><span data-i18n="settings.allowDelegation"></span></label><p class="hint" id="ultra-hint" data-i18n="settings.ultraHint"></p><p class="warning" id="ultra-policy-warning" role="status" aria-live="polite" hidden></p></div>
        <div class="wide"><label for="use-priority-service-tier" data-i18n="settings.processingSpeed"></label><select id="use-priority-service-tier"></select><span id="processing-speed-retained" class="hint" data-i18n="settings.processingSpeedRetainedHint" hidden></span><span class="hint" data-i18n="settings.processingSpeedHint"></span></div>
        <section class="wide policy-panel" id="fixed-policy-panel">
          <div class="grid">
            <label><span data-i18n="settings.model"></span><select id="policy-model" required></select><span class="hint" data-i18n="settings.modelHint"></span></label>
            <label><span data-i18n="settings.effort"></span><select id="policy-effort" required aria-describedby="effort-description effort-compatibility"></select><span class="hint" id="effort-description" aria-live="polite"></span><span class="hint inline-warning" id="effort-compatibility"></span></label>
          </div>
          <div class="notice" data-i18n="settings.fixedNotice"></div>
        </section>
        <section class="wide policy-panel" id="automatic-policy-panel" hidden>
          <div class="grid">
            <label class="wide"><span data-i18n="settings.allowedScope"></span><select id="allowed-scope"><option value="catalog-visible" data-i18n="settings.allowedScope.catalog"></option><option value="explicit" data-i18n="settings.allowedScope.explicit"></option></select></label>
            <div class="wide" id="explicit-selection-panel" hidden>
              <div class="hint" data-i18n="settings.commonEffortsHint"></div>
              <div class="explicit-layout">
                <fieldset class="choice-group"><legend class="hint" data-i18n="settings.allowedModels"></legend><div class="selection-list" id="allowed-models"></div></fieldset>
                <fieldset class="choice-group"><legend class="hint" data-i18n="settings.commonEfforts"></legend><div class="selection-list" id="common-efforts"></div></fieldset>
              </div>
              <div class="hint selection-count" id="selection-count" aria-live="polite"></div>
              <div class="hint effort-exclusions" id="unsupported-model-efforts" role="status" aria-live="polite" hidden></div>
              <p class="warning" id="model-effort-warning" role="status" hidden></p>
            </div>
          </div>
          <div class="notice" data-i18n="settings.automaticNotice"></div>
          <section class="model-descriptions-panel" aria-labelledby="model-descriptions-title">
            <h2 id="model-descriptions-title" data-i18n="settings.modelDescriptions.title"></h2>
            <p class="hint" data-i18n="settings.modelDescriptions.hint"></p>
            <label class="checkline"><input type="checkbox" id="show-all-model-descriptions" /><span data-i18n="settings.modelDescriptions.showAll"></span></label>
            <div id="model-descriptions"></div>
          </section>
        </section>
        <section class="wide projects-panel" aria-labelledby="projects-title">
          <div class="projects-header"><div><h2 id="projects-title" data-i18n="settings.projects"></h2><div class="hint" data-i18n="settings.projectsHint"></div></div><button id="add-project" type="button" data-i18n="settings.addProject"></button></div>
          <div class="project-list" id="project-list"></div>
          <p class="no-projects" id="no-projects" data-i18n="settings.noProjects"></p>
          <p class="field-error" id="project-error" role="alert" aria-live="polite"></p>
          <section id="project-recovery" hidden>
            <h3 data-i18n="settings.recoverableProjects"></h3>
            <p class="hint" data-i18n="settings.projectRecoveryHint"></p>
            <div id="project-recovery-list" class="project-list"></div>
          </section>
        </section>
        <label><span data-i18n="settings.threadStorage"></span><select id="bridge-thread-persistence"><option value="persistent" data-i18n="settings.threadStorage.persistent"></option><option value="ephemeral" data-i18n="settings.threadStorage.ephemeral"></option></select></label>
        <div class="wide"><label class="checkline"><input id="show-bridge-threads-in-codex-app" type="checkbox" /><span data-i18n="settings.codexAppThreads"></span></label><span class="hint" id="codex-app-threads-hint"></span></div>
        <label><span data-i18n="settings.language"></span><select id="ui-language"></select><span class="hint" data-i18n="settings.languageHint"></span></label>
        <section class="wide" id="history-settings" hidden><label><span data-i18n="history.period"></span><select id="history-retention"></select></label><p id="history-settings-policy" class="hint" style="white-space:pre-line"></p></section>
        <label><span data-i18n="settings.concurrency"></span><input id="concurrency" type="number" min="1" step="1" required /></label>
      </div>
      <div class="warning" id="catalog-warning" role="status" aria-live="polite"><span id="catalog-warning-text"></span><br /><button id="retry-models" type="button" data-i18n="settings.refreshModels" hidden></button></div>
      <div class="actions"><button class="primary" id="save" type="submit" data-i18n="settings.save"></button><button id="reset" type="button" data-i18n="settings.reset"></button><span id="status" role="status" aria-live="polite"></span></div>
      <div class="hint" data-i18n="settings.resetHint"></div>
    </form>
  </main>
  <script>

trol other reasoning levels or agent features.","unavailable while Ultra is off","Ultra is disabled. Choose another reasoning level for the fixed model.","No selected model and reasoning combination can run while Ultra is off. Saved choices are kept. Select another available level to run work.","Model descriptions","GPT uses these descriptions to choose a model in automatic mode.","Official description","User description","Edit","Save description","Use official description","View official description","No official description is available.","This model is not in the current catalog. Saved descriptions and versions are kept.","Model description saved.","Using the catalog description.","Up to 2,000 characters. Leave blank to use the official description.","Settings changed elsewhere. Your text is kept. Review the saved description and save again.","The description must be no longer than 2,000 characters.","Description","Version history","Loading versions…","No saved versions yet.","Imported saved value","Version","Saved version","Current description","Apply this version","Show older versions","Previous version applied.","Model","Codex default model","Exact identifier from the active backend catalog.","currently saved","Reasoning effort","Model default effort","Only values supported by the selected model are shown.","A newly available reasoning level. Availability and behavior come from the current Codex model catalog.","The saved reasoning level is no longer supported. Suggested model default:","Fastest responses with only essential reasoning.","Quick responses with lighter reasoning.","Balanced reasoning depth and response time.","Deeper review for complex work with a longer response time.","Very deep reasoning for difficult tasks; responses can take substantially longer.","Maximum available reasoning depth for demanding work.","Extended reasoning and delegation for the most demanding work.","Service tier","Backend default tier","Fast mode","Runs supported models faster. The model and reasoning level stay the same; usage or costs may increase.","This exact selection is enforced for Codex turns admitted after saving. An already active turn keeps its admission-time decision.","GPT selection range","All available models and efforts","Only models and efforts I choose","Select models first, then choose the reasoning efforts allowed for each model.","Models to use","Reasoning efforts by selected model","All","Some efforts are selected.","Additional service-tier variants","{count} exact selections","Default selection when GPT does not choose","Default model when GPT does not choose","Default reasoning effort when GPT does not choose","Use the Codex default when GPT does not choose","GPT must explicitly choose one exact model and reasoning effort from this range for every new Activity, new Agent, or fresh context. Continue and fork inherit the retained thread when selection is omitted. Fast mode is applied separately by the bridge. Choosing all available models and efforts automatically includes newly added options.","Model catalog valid","Model catalog using last known good data","Model catalog unavailable","Choose an exact model and reasoning effort.","Select at least one allowed exact selection.","Choose a common reasoning level supported by {model}.","Projects","Register the folders where Codex may start work. You can add multiple unrelated locations on this PC; internal routing IDs are managed automatically.","Bridge-allowed roots","Projects must resolve inside one of these security ceilings. Registering a project cannot widen them.","Add project","Register first project","Register a project first. Codex needs a folder where it can start work, and you may add multiple folders from different locations on this PC.","Project name","Absolute folder","Available","Needs recovery","New","Archive","Restore","Remove","Delete","Cancel deletion","Delete this project registration and its Bridge sessions, assignments and execution results when you save? Files, folders, Git and original Codex/ChatGPT conversations are preserved.","Archived","Ending project use…","Archive unresolved. Retry cleanup.","Retry archive","Press Save to archive this project.","Press Save to restore this project.","Press Save to delete this project registration.","Enter 1–120 printable Unicode characters for the project name.","Enter an existing absolute folder path.","Another active project already uses this folder.","Fix or archive every project that needs recovery before saving.","At most 100 projects can be registered.","Review the Projects section and correct the highlighted values.","Interface language","Automatic","Automatic follows the host application's language.","Maximum concurrent jobs","Experimental","Experimental","Receive Codex results directly","While the current ChatGPT run remains active, it waits for each new Codex job in bounded intervals and receives the terminal result directly. Codex keeps running if the conversation, app, screen, or connection interrupts the wait, but automatic continuation in those states is not guaranteed. Applies only to new jobs.","Show bridge threads in the Codex app","Saving a conversation and opening it in the Codex app are separate. Opening requires access to its original storage and release of the current writer. Independent Bridge storage is not automatically shared with the app.","Do not show automatically","Settings changed elsewhere. The latest values were loaded; review them and save again.","Save settings","Retry model lookup","Restore general defaults","Restores access, model, Codex-app thread visibility, interface, and concurrency settings. Projects, their order, and model description history are kept.","Saving…","Saved.","Saved and active. This deployment also changed the static tool contract; refresh the ChatGPT developer-mode connection once to adopt it.","Retrying model lookup…","Model list loaded.","Restoring…","General defaults restored. Projects were kept.","The settings tool returned an invalid response.","These settings are shared by all conversations using this bridge instance, not stored per ChatGPT account. Bridge security policy cannot be changed here.","The model catalog could not be refreshed. The last successfully verified catalog is shown temporarily.","The model catalog is unavailable. Restore backend access and retry model lookup.","CODEX_MCP_BRIDGE_ROOTS is a legacy compatibility restriction. Remove it to manage project folders only from Codex settings.","CODEX_MCP_BRIDGE_FAST_RETURN_MS is retired and ignored. Codex tasks always return after durable asynchronous admission.","CODEX_MCP_BRIDGE_UPSTREAM_TIMEOUT_MS is retired and ignored. Codex execution has no time limit; use supervised force-stop when needed.","CODEX_MCP_BRIDGE_DEFAULT_SESSION_MODE is retired and ignored. Each Activity manages its own session selection.","CODEX_MCP_BRIDGE_AUTO_RESUME_TTL_MS is retired and ignored. Exact Activity thread continuation has no age limit.","Legacy project IDs and default aliases were not migrated. Register projects by name in Settings.","The automatic model policy had no exact fallback, so the configured model and effort were saved as its fallback when GPT omits a selection.","A retired automatic model default was removed. GPT must now choose an exact model and reasoning effort for new work.","The saved full-access mode is retained but inactive because bridge security policy disables danger-full-access. Read-only is enforced until full access is enabled in runtime settings.","The saved concurrent-job limit was reduced to the current bridge maximum.","Saved project “{project}” is unavailable and cannot accept new work.","The legacy model-only preference “{model}” is still active. Its exact default effort comes from the backend catalog, while Fast mode remains a separate preference.","The legacy automatic model policy has no exact saved fallback. The backend catalog default remains in use until a default model and reasoning effort are saved in Settings.","The saved model policy is incompatible with the current catalog or constraints. Review it and save a valid selection{codeSuffix}.","A bridge warning requires attention. Review the bridge diagnostics for details.","Pending project cleanup","Earlier deleted registrations need confirmed cleanup. Retry ending project use before registering the folder again.","This folder has active work or unfinished project cleanup. Finish or retry that cleanup first.","Archive cleanup is not confirmed. Retry cleanup before deleting the registration.","Conversation storage","Save across restarts","Memory only","Processing speed","Keep existing behavior (clear conversation speed)","Keep existing Fast (conversation)","Inherit conversation speed","Standard","Fast","Ultrafast","Unrecognized saved speed: {value}","Speed changes apply to new Jobs. Faster modes can affect usage or charges. Ultrafast appears only when account and workspace access is confirmed.","Choose a compatible Codex installation to enable Standard and other speed choices.","Ultrafast access cannot currently be confirmed. Your saved choice is retained; select another speed to start new work.","Choose a speed","Your current speed setting is kept until you choose a speed.","Reasoning levels to use","Selected reasoning levels apply to all selected models that support them.","{models} models · {count} executable combinations","Show all models","No models are currently allowed. Show all models to view their descriptions.","Select models to see the reasoning levels they support.","{model} does not support {efforts}; these reasoning levels will not be applied."],"ko":["종료된 실패는 확인 의무 없이 기록으로 보관됩니다. 브리지가 안전한 복구를 자동 수행하고 확인된 결과를 기록합니다. 진행 중인 작업, 미전달 결과, Codex 대화와 프로젝트 파일은 보존합니다.","문제는 보관 기간 동안 확인할 수 있습니다. 확인함을 눌러도 실패 결과는 유지됩니다. 진행 중인 작업과 미전달 결과는 보존하며, Codex 대화와 프로젝트 파일은 유지됩니다.","실행 기록 보관","보관 기간","{days}일","계속 보관","종료한 실행 기록은 {days}일 뒤 자동 정리됩니다.","실행 기록을 계속 보관합니다.","실패·중단은 최근 7일 동안 확인이 필요합니다. 확인함을 누르면 문제 집계에서 제외됩니다. 진행 중인 작업과 미전달 결과는 보존하며, Codex 대화와 프로젝트 파일은 유지됩니다.","최근 정리: {time} · {count}건","확인함","시작 {relative}","불러오는 중…","새로고침","취소","확인","요청에 실패했습니다.","요청에 실패했습니다({code}).","일부 추가 정보를 갱신하지 못했습니다. 마지막 확인값이 표시될 수 있습니다.","Codex Bridge 설정","이 브리지 연결을 사용하는 모든 대화에 공유됩니다.","접근 전략","항상 읽기 전용","브리지 기본값","항상 전체 접근","모든 새 작업을 읽기 전용으로 고정합니다.","브리지에 저장된 기본 접근 권한으로 새 작업을 실행합니다.","모든 새 작업을 danger-full-access로 고정합니다.","전체 접근은 이 macOS 사용자의 파일시스템·네트워크 권한으로 Codex를 실행합니다. 프로젝트 폴더는 작업 시작 위치를 정할 뿐 OS 격리가 아닙니다.","실행 모델 정책","고정","자동 선택","Ultra 추론 허용","Ultra에는 자동 작업 위임이 포함됩니다. 끄면 저장된 선택을 포함해 GPT가 실행할 수 있는 조합에서 Ultra가 제외됩니다. 다른 추론 수준이나 에이전트 기능은 이 설정의 제어 대상이 아닙니다.","Ultra 비활성화로 사용 불가","Ultra가 비활성화되어 있습니다. 고정 모델에 사용할 다른 추론 수준을 선택해 주세요.","Ultra가 꺼져 있어 현재 선택한 모델과 추론 조합으로 작업을 실행할 수 없습니다. 저장된 선택은 유지됩니다. 작업을 실행하려면 사용 가능한 다른 추론 수준을 선택해 주세요.","모델 설명","자동 모드에서 GPT가 모델을 선택할 때 참고하는 설명입니다.","공식 설명","사용자 설명","수정","설명 저장","공식 설명으로 복원","공식 설명 보기","제공된 공식 설명이 없습니다.","현재 카탈로그에 없는 모델입니다. 저장된 설명과 버전 기록은 유지됩니다.","모델 설명을 저장했습니다.","공식 설명을 사용합니다.","최대 2,000자. 비우면 공식 설명을 사용합니다.","다른 화면에서 설정이 변경되었습니다. 입력한 내용은 유지됩니다. 저장된 설명을 확인한 뒤 다시 저장해 주세요.","설명은 2,000자 이내로 입력해 주세요.","설명","버전 기록","버전을 불러오는 중…","저장된 버전이 없습니다.","기존 저장값","버전","저장된 문구","현재 설명","이 버전 적용","이전 버전 더 보기","이전 버전을 적용했습니다.","모델","Codex 기본 모델","활성 백엔드 카탈로그의 정확한 식별자입니다.","현재 저장됨","추론 에포트","모델 기본 에포트","선택한 모델이 지원하는 값만 표시합니다.","현재 Codex 모델 카탈로그에서 제공된 새 추론 단계입니다.","저장된 추론 단계는 더 이상 지원되지 않습니다. 권장 모델 기본값:","필수 추론만 사용해 가장 빠르게 응답합니다.","가벼운 추론으로 빠르게 응답합니다.","추론 깊이와 응답 시간의 균형을 맞춥니다.","복잡한 작업을 더 깊게 검토하지만 응답 시간이 늘어날 수 있습니다.","어려운 작업을 매우 깊게 추론하므로 응답이 상당히 오래 걸릴 수 있습니다.","까다로운 작업에 사용할 수 있는 최대 추론 깊이입니다.","가장 까다로운 작업을 위해 확장 추론과 위임을 사용합니다.","서비스 티어","백엔드 기본 티어","빠른 처리 (Fast)","지원되는 모델을 더 빠르게 실행합니다. 모델과 추론 수준은 유지되며, 사용량이나 비용이 늘어날 수 있습니다.","저장 이후 접수되는 Codex turn에는 이 exact selection이 강제됩니다. 이미 실행 중인 turn은 접수 시점 결정을 유지합니다.","GPT 자동 선택 범위","사용 가능한 모든 모델·에포트","직접 선택한 모델·에포트만","먼저 모델을 선택한 다음, 모델별로 허용할 추론 에포트를 고르세요.","사용할 모델","선택한 모델별 추론 에포트","모두","일부 에포트가 선택되어 있습니다.","추가 서비스 티어 조합","선택한 모델·에포트 조합 {count}개","선호 selection","GPT 미지정 시 기본 모델","GPT 미지정 시 기본 추론 수준","GPT 미지정 시 Codex 기본값 사용","새 Activity, 새 Agent 또는 fresh context에서는 GPT가 이 범위의 정확한 모델과 추론 수준을 반드시 명시해야 합니다. 기존 작업의 continue/fork에서 생략하면 해당 스레드의 선택을 그대로 상속합니다. 빠른 처리는 브리지가 별도로 적용합니다. ‘사용 가능한 모든 모델·에포트’를 선택하면 새로 추가된 항목도 자동으로 포함됩니다.","모델 카탈로그 정상","모델 카탈로그: 마지막 정상 데이터 사용 중","모델 카탈로그 사용 불가","정확한 모델과 추론 에포트를 선택하세요.","허용할 exact selection을 하나 이상 선택하세요.","공통 추론 목록에서 {model} 모델이 지원하는 추론을 하나 이상 선택하세요.","프로젝트","Codex가 작업을 시작할 폴더를 등록하세요. 이 PC의 서로 다른 위치에 있는 폴더를 여러 개 추가할 수 있으며 내부 ID는 자동으로 관리됩니다.","브리지 허용 루트","프로젝트 실경로는 이 보안 상한 중 하나 안에 있어야 합니다. 프로젝트를 등록해도 범위는 넓어지지 않습니다.","추가","첫 프로젝트 등록","먼저 프로젝트를 등록하세요. Codex가 작업을 시작할 폴더가 필요합니다. 이 PC의 서로 다른 위치에 있는 폴더를 여러 개 추가할 수 있습니다.","프로젝트 이름","절대 폴더 경로","사용 가능","복구 필요","새 항목","보관","복원","제거","삭제","삭제 취소","저장하면 프로젝트 등록과 브리지 세션·배정·실행 결과를 삭제합니다. 실제 폴더·파일·Git·원본 Codex/ChatGPT 대화는 그대로 유지됩니다.","보관됨","프로젝트 사용 종료 중…","보관 미해결. 정리를 다시 시도하세요.","보관 재시도","저장 버튼을 누르면 이 프로젝트가 보관됩니다.","저장 버튼을 누르면 이 프로젝트가 복원됩니다.","저장 버튼을 누르면 이 프로젝트 등록이 삭제됩니다.","프로젝트 이름을 출력 가능한 Unicode 1~120자로 입력하세요.","현재 존재하는 절대 폴더 경로를 입력하세요.","다른 활성 프로젝트가 이미 이 폴더를 사용하고 있습니다.","복구가 필요한 프로젝트를 수정하거나 보관한 뒤 저장하세요.","프로젝트는 최대 100개까지 등록할 수 있습니다.","프로젝트 섹션의 강조된 값을 확인하고 수정하세요.","인터페이스 언어","자동","자동은 호스트 앱의 언어를 따릅니다.","최대 동시 작업 수","실험 기능","Experimental","Codex 결과 직접 수신","현재 ChatGPT 실행이 유지되는 동안 새 Codex 작업을 제한 시간 단위로 기다려 종료 결과를 직접 받습니다. 대화 이동, 앱 백그라운드, 화면 잠금 또는 연결 유실로 대기가 끊겨도 Codex 작업은 계속되지만, 해당 상태에서 자동 연속 진행은 보장되지 않습니다. 이후 새 작업부터 적용됩니다.","브리지 스레드를 Codex 앱에 표시","대화 저장과 Codex 앱에서 열기는 별개입니다. 앱에서 열려면 원본 저장소에 접근하고 현재 실행 연결을 해제해야 합니다. Bridge 전용 저장소는 앱에 자동 공유되지 않습니다.","자동으로 표시하지 않음","다른 곳에서 설정이 변경되었습니다. 최신 값을 불러왔으니 확인한 뒤 다시 저장하세요.","설정 저장","모델 불러오기 재시도","일반 설정 기본값 복원","접근, 모델, Codex 앱 목록 표시, 인터페이스와 동시 작업 수 설정을 복원합니다. 프로젝트와 순서는 유지됩니다. 모델 설명 버전 기록도 유지됩니다.","저장 중…","저장했습니다.","저장되어 즉시 반영되었습니다. 이 배포에서 정적 도구 계약도 변경되었으므로 ChatGPT 개발자 모드 연결을 한 번 새로고침해 적용하세요.","모델을 다시 불러오는 중…","모델 목록을 불러왔습니다.","복원 중…","일반 설정을 기본값으로 복원했습니다. 프로젝트는 유지되었습니다.","설정 도구가 올바른 응답을 반환하지 않았습니다.","이 설정은 ChatGPT 계정별 값이 아니라 이 브리지 인스턴스를 사용하는 모든 대화에 공유됩니다. 브리지 보안 정책은 여기서 변경할 수 없습니다.","모델 카탈로그를 새로고침하지 못했습니다. 마지막으로 검증에 성공한 카탈로그를 임시로 표시합니다.","모델 카탈로그를 사용할 수 없습니다. 백엔드 연결을 복구한 뒤 모델 조회를 다시 시도하세요.","CODEX_MCP_BRIDGE_ROOTS는 이전 버전 호환용 제한입니다. 프로젝트 폴더를 Codex 설정에서만 관리하려면 이 값을 제거하세요.","CODEX_MCP_BRIDGE_FAST_RETURN_MS는 폐기되어 무시됩니다. Codex 작업은 항상 영속 비동기 접수 후 반환됩니다.","CODEX_MCP_BRIDGE_UPSTREAM_TIMEOUT_MS는 폐기되어 무시됩니다. Codex 실행에는 시간 제한이 없으므로 필요할 때 감독하에 강제 종료하세요.","CODEX_MCP_BRIDGE_DEFAULT_SESSION_MODE는 폐기되어 무시됩니다. 세션 선택은 각 Activity에서 관리합니다.","CODEX_MCP_BRIDGE_AUTO_RESUME_TTL_MS는 폐기되어 무시됩니다. 동일한 Activity 스레드를 이어가는 데에는 시간 제한이 없습니다.","이전 프로젝트 ID와 기본 별칭은 마이그레이션되지 않았습니다. 설정에서 프로젝트를 이름으로 등록하세요.","자동 모델 정책에 정확한 폴백이 없어, 설정된 모델과 에포트를 GPT가 선택을 생략할 때 사용할 폴백으로 저장했습니다.","폐기된 자동 모델 기본값을 제거했습니다. 이제 새 작업에는 GPT가 정확한 모델과 추론 수준을 선택해야 합니다.","저장된 전체 접근 모드는 유지되지만 브리지 보안 정책에서 danger-full-access를 허용하지 않아 현재 비활성 상태입니다. 런타임 설정에서 전체 접근을 허용할 때까지 읽기 전용으로 실행됩니다.","저장된 동시 작업 수를 현재 브리지의 최댓값으로 줄였습니다.","저장된 프로젝트 ‘{project}’을(를) 사용할 수 없어 새 작업을 받을 수 없습니다.","이전 모델 전용 설정 ‘{model}’이(가) 아직 적용 중입니다. 정확한 기본 에포트는 백엔드 카탈로그에서 가져오며 빠른 처리는 별도 설정으로 유지됩니다.","이전 자동 모델 정책에 저장된 정확한 폴백이 없습니다. 설정에서 기본 모델과 추론 에포트를 저장할 때까지 백엔드 카탈로그 기본값을 사용합니다.","저장된 모델 정책이 현재 카탈로그 또는 제약 조건과 맞지 않습니다. 확인한 뒤 유효한 선택을 저장하세요{codeSuffix}.","확인이 필요한 브리지 경고가 있습니다. 자세한 내용은 브리지 진단을 확인하세요.","프로젝트 정리 대기","이전에 삭제된 등록의 정리를 확인해야 합니다. 같은 폴더를 다시 등록하기 전에 프로젝트 사용 종료를 재시도하세요.","이 폴더에 실행 중인 작업이나 미완료 프로젝트 정리가 있습니다. 먼저 종료하거나 정리를 다시 시도하세요.","보관 정리가 확인되지 않았습니다. 등록을 삭제하기 전에 정리를 다시 시도하세요.","대화 저장","재시작 후에도 저장","메모리에만 저장","처리 속도","기존 동작 유지 (대화 속도 해제)","기존 Fast 유지 (대화 설정)","대화 속도 상속","Standard","Fast","Ultrafast","알 수 없는 저장 속도: {value}","속도 변경은 새 작업부터 적용합니다. 빠른 속도는 사용량이나 요금에 영향을 줄 수 있습니다. Ultrafast는 계정과 워크스페이스 사용 권한이 확인된 경우에만 표시합니다.","Standard 등 속도를 선택하려면 호환되는 Codex 설치를 선택하세요.","Ultrafast 사용 권한을 현재 확인할 수 없습니다. 저장된 선택은 유지됩니다. 새 작업을 시작하려면 다른 속도를 선택하세요.","속도를 선택하세요","속도를 선택하기 전까지 현재 설정을 유지합니다.","사용할 추론 수준","선택한 추론은 이를 지원하는 모든 선택 모델에 적용됩니다.","모델 {models}개 · 실행 가능한 조합 {count}개","전체 모델 보기","현재 허용된 모델이 없습니다. 전체 모델 보기에서 설명을 확인할 수 있습니다.","사용할 모델을 선택하면 지원되는 추론 수준이 표시됩니다.","{model} 모델은 {efforts} 추론을 지원하지 않아 적용되지 않습니다."],"ja":["終了した失敗は確認不要の履歴として保持します。ブリッジが安全な復旧を自動実行し、検証済みの結果を記録します。進行中の作業、未配信の結果、Codexの会話とプロジェクトファイルは保持します。","問題は保持期間中に確認できます。確認しても失敗の結果は変わりません。進行中の作業、未配信の結果、Codexの会話とプロジェクトファイルは保持されます。","実行履歴の保持","保持期間","{days}日","無期限に保持","終了した実行履歴は{days}日後に自動整理されます。","実行履歴を無期限に保持します。","失敗・中断は直近7日間、確認が必要です。「確認済み」で問題の集計から除外します。進行中の作業と未配信の結果、Codexの会話とプロジェクトファイルは保持します。","前回の整理: {time} · {count}件","確認済み","開始 {relative}","読み込み中…","更新","キャンセル","確認","リクエストに失敗しました。","リクエストに失敗しました（{code}）。","一部の詳細を更新できませんでした。最後に確認した値が表示される場合があります。","Codex Bridge 設定","このブリッジ接続を使うすべての会話で共有されます。","アクセス方式","常に読み取り専用","ブリッジの既定値","常にフルアクセス","すべての新規タスクを読み取り専用に固定します。","新しいタスクにはブリッジで設定された既定のアクセス権限を適用します。","すべての新規タスクを danger-full-access に固定します。","フルアクセスでは、この macOS ユーザーのファイルシステム権限とネットワーク権限で Codex が実行されます。プロジェクトフォルダーは開始位置を選ぶだけで、OS レベルの隔離ではありません。","実行モデルポリシー","固定","自動選択","Ultra 推論を許可","Ultra にはタスクの自動委任が含まれます。オフにすると、保存済みの選択を含め、GPT が実行できる選択肢から Ultra が除外されます。この設定は他の推論レベルやエージェント機能を制御しません。","Ultra がオフのため使用不可","Ultra は無効です。固定モデルに使用する別の推論レベルを選択してください。","Ultra がオフのため、選択したモデルと推論の組み合わせでは実行できません。保存済みの選択は保持されます。実行するには利用可能な別の推論レベルを選択してください。","モデルの説明","自動モードで GPT がモデルを選ぶ際に参照する説明です。","公式の説明","ユーザーの説明","編集","説明を保存","公式の説明に戻す","公式の説明を見る","公式の説明は提供されていません。","現在のカタログにないモデルです。保存済みの説明とバージョン履歴は保持されます。","モデルの説明を保存しました。","公式の説明を使用します。","最大2,000文字。空欄にすると公式の説明を使用します。","別の画面で設定が変更されました。入力内容は保持されています。保存済みの説明を確認して再度保存してください。","説明は2,000文字以内で入力してください。","説明","バージョン履歴","バージョンを読み込み中…","保存済みのバージョンはありません。","以前の保存値","バージョン","保存された文面","現在の説明","このバージョンを適用","古いバージョンを表示","以前のバージョンを適用しました。","既定モデル","Codex の既定モデル","インストール済みの Codex CLI から取得します。","保存済み","既定エフォート","モデルの既定エフォート","選択したモデルが対応する値だけを表示します。","現在の Codex モデルカタログで提供される新しい推論レベルです。","保存済みの推論レベルはサポートされなくなりました。推奨されるモデル既定値:","必要最小限の推論で最速に応答します。","軽い推論で素早く応答します。","推論の深さと応答時間のバランスを取ります。","複雑な作業を深く検討しますが応答時間が長くなる場合があります。","難しい作業を非常に深く推論するため、応答にかなり時間がかかる場合があります。","要求の高い作業に 履歴は保持されます。","保存中…","保存しました。","保存され、反映されました。このデプロイでは静的ツール契約も変更されたため、ChatGPT の開発者モード接続を一度更新して適用してください。","モデルを再読み込み中…","モデル一覧を読み込みました。","復元中…","一般設定を既定値に戻しました。プロジェクトは保持されています。","設定ツールから無効な応答が返されました。","この設定は ChatGPT アカウント別ではなく、このブリッジインスタンスを使用するすべての会話で共有されます。ブリッジのセキュリティポリシーはここでは変更できません。","モデルカタログを更新できませんでした。最後に検証できたカタログを一時的に表示しています。","モデルカタログを利用できません。バックエンドへの接続を復旧して、モデル検索を再試行してください。","CODEX_MCP_BRIDGE_ROOTS は旧バージョンとの互換性のための制限です。プロジェクトフォルダーを Codex 設定だけで管理するには削除してください。","CODEX_MCP_BRIDGE_FAST_RETURN_MS は廃止され、無視されます。Codex タスクは常に永続的な非同期受付後に応答します。","CODEX_MCP_BRIDGE_UPSTREAM_TIMEOUT_MS は廃止され、無視されます。Codex の実行に時間制限はありません。必要な場合は監視下で強制停止してください。","CODEX_MCP_BRIDGE_DEFAULT_SESSION_MODE は廃止され、無視されます。セッションの選択は各 Activity で管理されます。","CODEX_MCP_BRIDGE_AUTO_RESUME_TTL_MS は廃止され、無視されます。同じ Activity スレッドの継続に有効期限はありません。","旧形式のプロジェクト ID と既定の別名は移行されませんでした。設定でプロジェクトを名前から登録してください。","自動モデルポリシーに正確なフォールバックがなかったため、設定済みのモデルとエフォートを GPT が選択を省略した場合のフォールバックとして保存しました。","廃止された自動モデルの既定値を削除しました。新しい作業では GPT が正確なモデルと推論エフォートを選択する必要があります。","保存済みのフルアクセス設定は維持されますが、ブリッジのセキュリティポリシーで danger-full-access が無効なため現在は適用されません。ランタイム設定でフルアクセスを有効にするまで読み取り専用で実行されます。","保存済みの同時ジョブ数を、現在のブリッジの上限まで減らしました。","保存済みのプロジェクト「{project}」は利用できないため、新しい作業を受け付けられません。","旧形式のモデルのみの設定「{model}」が引き続き有効です。正確な既定エフォートはバックエンドカタログから取得され、高速処理 は別の設定として維持されます。","旧形式の自動モデルポリシーには、保存済みの正確なフォールバックがありません。設定で既定のモデルと推論エフォートを保存するまで、バックエンドカタログの既定値を使用します。","保存済みのモデルポリシーは、現在のカタログまたは制約と互換性がありません。確認して有効な選択を保存してください{codeSuffix}。","確認が必要なブリッジ警告があります。詳細はブリッジの診断情報を確認してください。","プロジェクトの終了処理待ち","以前削除した登録の終了処理を確認する必要があります。同じフォルダーを登録する前に再試行してください。","このフォルダーで実行中の作業または未完了の終了処理があります。先に終了または再試行してください。","終了処理が確認できていません。登録を削除する前に再試行してください。","会話の保存","再起動後も保存","メモリのみ","処理速度","従来の動作を維持（会話の速度指定を解除）","従来のFastを維持（会話設定）","会話の速度を継承","Standard","Fast","Ultrafast","未認識の保存済み速度: {value}","速度の変更は新しい作業から適用されます。高速モードは使用量や料金に影響する場合があります。Ultrafastはアカウントとワークスペースの利用権限が確認された場合にのみ表示されます。","Standardなどの速度を選択するには、互換性のあるCodexを選択してください。","Ultrafastの利用権限は現在確認できません。保存済みの選択は保持されます。新しい作業には別の速度を選択してください。","速度を選択","速度を _SESSION_MODE 已停用並會被忽略。每個 Activity 會自行管理工作階段選擇。","CODEX_MCP_BRIDGE_AUTO_RESUME_TTL_MS 已停用並會被忽略。繼續同一 Activity 執行緒沒有時限。","舊版專案 ID 與預設別名未遷移。請在設定中依名稱註冊專案。","自動模型政策缺少確切的備援選項，因此已將設定的模型與推理強度儲存為 GPT 未選擇時的備援項目。","已移除停用的自動模型預設值。現在新工作必須由 GPT 選擇精確的模型與推理強度。","已儲存的完整存取設定會保留，但因橋接安全政策停用 danger-full-access，目前不會生效。在執行階段設定中啟用完整存取之前，將強制使用唯讀模式。","已將儲存的並行工作上限降至目前橋接的最大值。","已儲存的專案「{project}」無法使用，不能接收新工作。","舊版的僅模型設定「{model}」仍然有效。確切的預設推理強度來自後端目錄，快速處理 仍是獨立設定。","舊版自動模型政策沒有已儲存的確切備援項目。在設定中儲存預設模型與推理強度之前，會繼續使用後端目錄預設值。","儲存的模型政策與目前目錄或限制不相容。請檢查並儲存有效選項{codeSuffix}。","有一則橋接警告需要處理。詳細資訊請查看橋接診斷。","專案清理待完成","先前刪除的註冊需要確認清理。再次註冊此資料夾前，請重試結束專案使用。","此資料夾有執行中的工作或未完成的專案清理。請先完成或重試清理。","尚未確認封存清理。刪除註冊前請重試清理。","對話儲存","重新啟動後保留","僅記憶體","處理速度","保留原有行為（清除對話速度）","保留原有Fast（對話設定）","繼承對話速度","Standard","Fast","Ultrafast","無法識別的已儲存速度：{value}","速度變更僅套用至新工作。較快的模式可能影響用量或費用。只有確認帳戶和工作區存取權限後才會顯示Ultrafast。","請選擇相容的Codex安裝版本，以啟用Standard等速度選項。","目前無法確認Ultrafast使用權限。已儲存的選擇會保留；開始新工作前請選擇其他速度。","選擇速度","選擇速度之前會保留目前設定。","使用的推理層級","所選推理層級會套用到支援它們的所有已選模型。","{models} 個模型 · {count} 個可執行組合","顯示所有模型","目前沒有允許使用的模型。顯示所有模型即可查看說明。","選擇模型後將顯示它們支援的推理層級。","{model} 不支援 {efforts}，因此不會套用這些推理層級。"],"es":["Los fallos finalizados se conservan sin revisión obligatoria. El puente realiza recuperaciones seguras y registra resultados verificados. Se conservan el trabajo activo, los resultados sin entregar, las conversaciones de Codex y los archivos del proyecto.","Los problemas se pueden revisar durante el periodo de conservación. Revisarlos mantiene el resultado fallido. Se conservan el trabajo activo, los resultados sin entregar, las conversaciones de Codex y los archivos del proyecto.","Conservación del historial","Periodo de conservación","{days} días","Conservar siempre","Las ejecuciones finalizadas se limpian automáticamente después de {days} días.","El historial se conserva indefinidamente.","Los fallos y las interrupciones requieren revisión durante 7 días. Marcar como revisado los excluye del contador de problemas. Se conservan el trabajo activo, los resultados sin entregar, las conversaciones de Codex y los archivos del proyecto.","Última limpieza: {time} · {count} ejecuciones","Marcar como revisado","Iniciado {relative}","Cargando…","Actualizar","Cancelar","Confirmar","La solicitud falló.","La solicitud falló ({code}).","No se pudieron actualizar algunos datos. Pueden mostrarse los últimos valores comprobados.","Configuración de Codex Bridge","Compartida por todas las conversaciones que usan este puente.","Estrategia de acceso","Siempre solo lectura","Valor predeterminado del puente","Siempre acceso total","Todas las tareas nuevas se fuerzan a solo lectura.","Las tareas nuevas usan el acceso predeterminado configurado en el puente.","Todas las tareas nuevas se fuerzan a danger-full-access.","El acceso total ejecuta Codex con los permisos de archivos y red de este usuario de macOS. La carpeta del proyecto solo elige dónde empieza el trabajo; no aísla el sistema operativo.","Política del modelo de ejecución","Fijo","Selección automática","Permitir razonamiento Ultra","Ultra incluye la delegación automática de tareas. Al desactivarlo, Ultra se excluye de las opciones que GPT puede ejecutar, incluidas las guardadas. Este ajuste no controla otros niveles de razonamiento ni funciones de agentes.","no disponible con Ultra desactivado","Ultra está desactivado. Elige otro nivel de razonamiento para el modelo fijo.","Ninguna combinación seleccionada de modelo y razonamiento puede ejecutarse con Ultra desactivado. Las selecciones se conservan. Elige otro nivel disponible para ejecutar tareas.","Descripciones de modelos","GPT usa estas descripciones para elegir un modelo en modo automático.","Descripción oficial","Descripción del usuario","Editar","Guardar descripción","Restaurar descripción oficial","Ver descripción oficial","No hay una descripción oficial disponible.","Este modelo no está en el catálogo actual. Se conservan las descripciones y versiones guardadas.","Descripción del modelo guardada.","Se usa la descripción oficial.","Máximo 2.000 caracteres. Déjalo vacío para usar la descripción oficial.","La configuración cambió en otra pantalla. Tu texto se conserva. Revisa la descripción guardada y vuelve a guardar.","La descripción no puede superar los 2.000 caracteres.","Descripción","Historial de versiones","Cargando versiones…","Aún no hay versiones guardadas.","Valor guardado importado","Versión","Versión guardada","Descripción actual","Aplicar esta versión","Mostrar versiones anteriores","Se aplicó la versión anterior.","Modelo predeterminado","Modelo predeterminado de Codex","Cargado desde la CLI de Codex instalada.","guardado actualmente","Esfuerzo predeterminado","Esfuerzo predeterminado del modelo","Solo se muestran valores compatibles con el modelo seleccionado.","Un nuevo nivel de razonamiento ofrecido por el catálogo actual de Codex.","El nivel guardado ya no es compatible. Valor predeterminado sugerido:","Respuesta más rápida con solo el razonamiento esencial.","Respuestas rápidas con razonamiento ligero.","Equilibra profundidad de razonamiento y tiempo de respuesta.","Revisión más profunda para tareas complejas, con mayor tiempo de respuesta.","Razonamiento muy profundo para tareas difíciles; puede tardar bastante más.","Máxima profundidad de razonamiento disponible para tareas exigentes.","Razonamiento ampliado y delegación para las tareas más exigentes.","Nivel de servicio","Nivel predeterminado del backend","Modo rápido (Fast)","Ejecuta más rápido los modelos compatibles. El modelo y el nivel de razonamiento se mantienen; el consumo o el coste pueden aumentar.","Esta selección exacta se aplica a los turnos de Codex admitidos después de guardar. Un turno ya activo conserva la decisión tomada al admitirse.","Opciones disponibles para GPT","Todos los modelos y niveles disponibles","Solo los modelos y niveles que elija","Selecciona primero los modelos y después los niveles de razonamiento permitidos para cada uno.","Modelos que se usarán","Niveles de razonamiento por modelo seleccionado","Todos","Hay algunos niveles seleccionados.","Variantes adicionales de nivel de servicio","Combinaciones seleccionadas: {count}","Selección predeterminada si GPT no elige","Modelo predeterminado si GPT no elige","Nivel predeterminado si GPT no elige","Usar el valor predeterminado de Codex si GPT no elige","GPT debe indicar un modelo y nivel de razonamiento exactos de este intervalo para cada Activity, Agent o contexto nuevo. continue/fork hereda el hilo conservado si se omite la selección. El puente aplica el modo rápido por separado.","Catálogo de modelos válido","El catálogo usa los últimos datos válidos","Catálogo de modelos no disponible","Elige un modelo y un nivel de razonamiento exactos.","Selecciona al menos una combinación exacta permitida.","Elige un nivel de razonamiento común compatible con {model}.","Proyectos","Registra las carpetas donde Codex puede empezar a trabajar. Puedes añadir varias ubicaciones independientes de este PC; los ID internos se gestionan automáticamente.","Raíces permitidas por el puente","La ruta real de cada proyecto debe estar dentro de uno de estos límites de seguridad. Registrar un proyecto no los amplía.","Añadir proyecto","Registrar primer proyecto","Registra primero un proyecto. Codex necesita una carpeta donde empezar a trabajar; puedes añadir varias carpetas de distintas ubicaciones de este PC.","Nombre del proyecto","Carpeta absoluta","Disponible","Necesita recuperación","Nuevo","Archivar","Restaurar","Eliminar","Eliminar","Cancelar eliminación","Al guardar se eliminan el registro, las sesiones, las asignaciones y los resultados del puente. Se conservan carpetas, archivos, Git y conversaciones originales de Codex/ChatGPT.","Archivado","Finalizando el uso del proyecto…","Archivo sin resolver. Reintenta la limpieza.","Reintentar archivo","Guarda para archivar este proyecto.","Guarda para restaurar este proyecto.","Guarda para eliminar el registro de este proyecto.","Introduce de 1 a 120 caracteres Unicode imprimibles para el nombre.","Introduce la ruta absoluta de una carpeta existente.","Otro proyecto activo ya utiliza esta carpeta.","Corrige o archiva los proyectos que necesitan recuperación antes de guardar.","Se pueden registrar como máximo 100 proyectos.","Revisa la sección Proyectos y corrige los valores resaltados.","Idioma de la interfaz","Automático","El modo automático sigue el idioma de la aplicación anfitriona.","Máximo de trabajos simultáneos","Experimental","Experimental","Recibir los resultados de Codex directamente","Mientras la ejecución actual de ChatGPT siga activa, espera cada trabajo nuevo de Codex en intervalos limitados y recibe directamente el resultado final. Codex sigue ejecutándose si un cambio de conversación, el segundo plano, el bloqueo de pantalla o una desconexión interrumpen la espera, pero no se garantiza la continuación automática en esos estados. Solo se aplica a trabajos nuevos.","Mostrar los hilos del puente en la app Codex","Guardar una conversación y abrirla en la aplicación Codex son funciones independientes. Abrirla requiere acceso al almacenamiento original y liberar la conexión que escribe. El almacenamiento de Bridge no se comparte automáticamente con la aplicación.","No mostrar automáticamente","La configuración cambió en otro lugar. Se cargaron los valores más recientes; revísalos y vuelve a guardar.","Guardar configuración","Reintentar la carga de modelos","Restaurar valores generales","Restaura el acceso, el modelo, la visibilidad de hilos en Codex, la interfaz y la concurrencia. Se conservan los proyectos, su orden y el historial de descripciones de modelos.","Guardando…","Guardado.","Guardado y activo. Este despliegue también cambió el contrato estático de herramientas; actualiza una vez la conexión del modo desarrollador de ChatGPT para aplicarlo.","Reintentando la carga de modelos…","Lista de modelos cargada.","Restaurando…","Se restauraron los valores generales. Los proyectos se conservaron.","La herramienta de configuración devolvió una respuesta no válida.","Esta configuración se comparte entre todas las conversaciones que usan esta instancia del puente; no se guarda por cuenta de ChatGPT. La política de seguridad del puente no puede cambiarse aquí.","No se pudo actualizar el catálogo de modelos. Se muestra temporalmente el último catálogo verificado correctamente.","El catálogo de modelos no está disponible. Restablece el acceso al backend y vuelve a intentar la consulta.","CODEX_MCP_BRIDGE_ROOTS es una restricción de compatibilidad antigua. Elimínala para administrar las carpetas de proyectos solo desde la configuración de Codex.","CODEX_MCP_BRIDGE_FAST_RETURN_MS se retiró y se ignora. Las tareas de Codex siempre responden tras una admisión asíncrona duradera.","CODEX_MCP_BRIDGE_UPSTREAM_TIMEOUT_MS se retiró y se ignora. La ejecución de Codex no tiene límite de tiempo; usa la detención forzada supervisada cuando sea necesario.","CODEX_MCP_BRIDGE_DEFAULT_SESSION_MODE se retiró y se ignora. Cada Activity administra su propia selección de sesión.","CODEX_MCP_BRIDGE_AUTO_RESUME_TTL_MS se retiró y se ignora. Continuar el mismo hilo de Activity no tiene límite de antigüedad.","Los ID de proyecto y alias predeterminados antiguos no se migraron. Registra los proyectos por nombre en Configuración.","La política automática no tenía una alternativa exacta, por lo que se guardaron el modelo y el esfuerzo configurados para cuando GPT omita la selección.","Se eliminó el valor predeterminado retirado del modelo automático. Ahora GPT debe elegir un modelo y un nivel de razonamiento exactos para el trabajo nuevo.","El modo de acceso completo guardado se conserva, pero permanece inactivo porque la política de seguridad del puente desactiva danger-full-access. Se aplica solo lectura hasta habilitar el acceso completo en la configuración de ejecución.","El límite de tareas simultáneas guardado se redujo al máximo actual del puente.","El proyecto guardado «{project}» no está disponible y no puede aceptar trabajo nuevo.","La preferencia antigua de solo modelo «{model}» sigue activa. El esfuerzo predeterminado exacto procede del catálogo del backend y el modo rápido sigue siendo una preferencia independiente.","La política automática antigua no tiene una alternativa exacta guardada. Se seguirá usando el valor predeterminado del catálogo del backend hasta guardar un modelo y esfuerzo predeterminados en Configuración.","La política de modelo guardada no es compatible con el catálogo o las restricciones actuales. Revísala y guarda una selección válida{codeSuffix}.","Hay una advertencia del puente que requiere atención. Consulta los diagnósticos del puente para obtener detalles.","Limpieza del proyecto pendiente","Las inscripciones eliminadas necesitan una limpieza confirmada. Reinténtala antes de registrar la carpeta de nuevo.","Esta carpeta tiene trabajo activo o una limpieza incompleta. Termina o reintenta la limpieza primero.","La limpieza no está confirmada. Reinténtala antes de eliminar la inscripción.","Almacenamiento de conversaciones","Conservar tras reiniciar","Solo en memoria","Velocidad de procesamiento","Mantener el comportamiento anterior (borrar velocidad de conversación)","Mantener Fast anterior (conversación)","Heredar velocidad de conversación","Standard","Fast","Ultrafast","Velocidad guardada desconocida: {value}","Los cambios de velocidad se aplican a los trabajos nuevos. Los modos más rápidos pueden afectar al uso o a los cargos. Ultrafast solo aparece cuando se confirma el acceso de la cuenta y del espacio de trabajo.","Elige una instalación compatible de Codex para habilitar Standard y las demás velocidades.","No se puede confirmar el acceso a Ultrafast. Se conserva tu selección; elige otra velocidad para iniciar un trabajo nuevo.","Elegir velocidad","La configuración actual se conserva hasta que elijas una velocidad.","Niveles de razonamiento que se usarán","Los niveles seleccionados se aplican a todos los modelos seleccionados que los admiten.","{models} modelos · {count} combinaciones ejecutables","Mostrar todos los modelos","No hay modelos permitidos. Muestra todos los modelos para ver sus descripciones.","Selecciona modelos para ver sus niveles de razonamiento compatibles.","{model} no admite {efforts}; estos niveles de razonamiento no se aplicarán."],"fr":["Les échecs terminés sont conservés sans vérification obligatoire. Le pont effectue une récupération sûre et consigne les résultats vérifiés. Le travail actif, les résultats non remis, les conversations Codex et les fichiers du projet sont conservés.","Les problèmes restent consultables pendant la durée de conservation. Leur vérification conserve le résultat d’échec. Le travail actif, les résultats non remis, les conversations Codex et les fichiers du projet sont conservés.","Conservation de l’historique","Durée de conservation","{days} jours","Conserver indéfiniment","Les exécutions terminées sont nettoyées automatiquement après {days} jours.","L’historique est conservé indéfiniment.","Les échecs et interruptions nécessitent une vérification pendant 7 jours. Les marquer comme vérifiés les retire du compteur de problèmes. Le travail actif, les résultats non remis, les conversations Codex et les fichiers du projet sont conservés.","Dernier nettoyage : {time} · {count} exécutions","Marquer comme vérifié","Démarré {relative}","Chargement…","Actualiser","Annuler","Confirmer","La requête a échoué.","La requête a échoué ({code}).","Certains détails n’ont pas pu être actualisés. Les dernières valeurs vérifiées peuvent être affichées.","Paramètres de Codex Bridge","Partagés par toutes les conversations utilisant ce pont.","Stratégie d’accès","Toujours en lecture seule","Valeur par défaut du pont","Toujours en accès complet","Chaque nouvelle tâche est forcée en lecture seule.","Les nouvelles tâches utilisent les droits d’accès par défaut configurés dans le pont.","Chaque nouvelle tâche est forcée en danger-full-access.","L’accès complet exécute Codex avec les autorisations de fichiers et de réseau de cet utilisateur macOS. Le dossier du projet choisit seulement le point de départ du travail ; il n’isole pas le système.","Politique du modèle d’exécution","Fixe","Sélection automatique","Autoriser le raisonnement Ultra","Ultra inclut la délégation automatique des tâches. Le désactiver exclut Ultra des choix que GPT peut exécuter, y compris les choix enregistrés. Ce réglage ne contrôle pas les autres niveaux de raisonnement ni les fonctions des agents.","indisponible lorsque Ultra est désactivé","Ultra est désactivé. Choisissez un autre niveau de raisonnement pour le modèle fixe.","Aucune combinaison de modèle et de raisonnement sélectionnée ne peut être exécutée lorsque Ultra est désactivé. Les choix sont conservés. Choisissez un autre niveau disponible pour exécuter des tâches.","Descriptions des modèles","GPT utilise ces descriptions pour choisir un modèle en mode automatique.","Description officielle","Description personnalisée","Modifier","Enregistrer la description","Rétablir la description officielle","Voir la description officielle","Aucune description officielle n’est disponible.","Ce modèle ne figure pas dans le catalogue actuel. Les descriptions et versions enregistrées sont conservées.","Description du modèle enregistrée.","La description officielle est utilisée.","2 000 caractères maximum. Laissez vide pour utiliser la description officielle.","Les paramètres ont changé dans une autre fenêtre. Votre texte est conservé. Vérifiez la description enregistrée, puis enregistrez à nouveau.","La description ne doit pas dépasser 2 000 caractères.","Description","Historique des versions","Chargement des versions…","Aucune version enregistrée.","Valeur enregistrée importée","Version","Version enregistrée","Description actuelle","Appliquer cette version","Afficher les anciennes versions","La version précédente a été appliquée.","Modèle par défaut","Modèle Codex par défaut","Chargé depuis la CLI Codex installée.","actuellement enregistré","Effort par défaut","Effort par défaut du modèle","Seules les valeurs prises en charge par le modèle sélectionné sont affichées.","Un nouveau niveau de raisonnement fourni par le catalogue Codex actuel.","Le niveau enregistré n’est plus pris en charge. Valeur par défaut suggérée :","Réponse la plus rapide avec le raisonnement essentiel uniquement.","Réponses rapides avec un raisonnement léger.","Équilibre profondeur du raisonnement et temps de réponse.","Examen approfondi des tâches complexes, avec un temps de réponse accru.","Raisonnement très approfondi pour les tâches difficiles ; la réponse peut être nettement plus longue.","Profondeur de raisonnement maximale pour les tâches exigeantes.","Raisonnement étendu et délégation pour les tâches les plus exigeantes.","Niveau de service","Niveau par défaut du backend","Mode rapide (Fast)","Accélère les modèles compatibles. Le modèle et le niveau de raisonnement restent identiques ; la consommation ou les coûts peuvent augmenter.","Cette sélection exacte s’applique aux tours Codex admis après l’enregistrement. Un tour déjà actif conserve la décision prise lors de son admission.","Choix disponibles pour GPT","Tous les modèles et niveaux disponibles","Uniquement les modèles et niveaux choisis","Sélectionnez d’abord les modèles, puis les niveaux de raisonnement autorisés pour chacun.","Modèles à utiliser","Niveaux de raisonnement par modèle sélectionné","Tous","Certains niveaux sont sélectionnés.","Variantes supplémentaires de niveau de service","Combinaisons sélectionnées : {count}","Sélection par défaut si GPT ne choisit pas","Modèle par défaut si GPT ne choisit pas","Effort par défaut si GPT ne choisit pas","Utiliser la valeur par défaut de Codex si GPT ne choisit pas","GPT doit indiquer un modèle et un effort de raisonnement exacts de cette plage pour toute nouvelle Activity, tout nouvel Agent ou contexte fresh. continue/fork hérite du thread conservé si le choix est omis. Le pont applique le mode rapide séparément.","Catalogue de modèles valide","Le catalogue utilise les dernières données valides","Catalogue de modèles indisponible","Choisissez un modèle et un niveau de raisonnement précis.","Sélectionnez au moins une combinaison exacte autorisée.","Choisissez un niveau de raisonnement commun pris en charge par {model}.","Projets","Enregistrez les dossiers où Codex peut commencer à travailler. Vous pouvez ajouter plusieurs emplacements indépendants sur ce PC ; les ID internes sont gérés automatiquement.","Racines autorisées par le pont","Le chemin réel de chaque projet doit rester dans l’une de ces limites de sécurité. Enregistrer un projet ne les élargit pas.","Ajouter un projet","Enregistrer le premier projet","Enregistrez d’abord un projet. Codex a besoin d’un dossier où commencer ; vous pouvez ajouter plusieurs dossiers situés à différents endroits sur ce PC.","Nom du projet","Dossier absolu","Disponible","Récupération requise","Nouveau","Archiver","Restaurer","Supprimer","Supprimer","Annuler la suppression","L’enregistrement, les sessions, les affectations et les résultats du pont seront supprimés. Les dossiers, fichiers, Git et conversations Codex/ChatGPT d’origine sont conservés.","Archivé","Fin de l’utilisation du projet…","Archivage non résolu. Relancez le nettoyage.","Réessayer l’archivage","Enregistrez pour archiver ce projet.","Enregistrez pour restaurer ce projet.","Enregistrez pour supprimer cet enregistrement de projet.","Saisissez 1 à 120 caractères Unicode imprimables pour le libellé.","Saisissez le chemin absolu d’un dossier existant.","Un autre projet actif utilise déjà ce dossier.","Corrigez ou archivez les projets à récupérer avant l’enregistrement.","Au maximum 100 projets peuvent être enregistrés.","Vérifiez la section Projets et corrigez les valeurs surlignées.","Langue de l’interface","Automatique","Le mode automatique suit la langue de l’application hôte.","Nombre maximal de tâches simultanées","Expérimental","Experimental","Recevoir directement les résultats Codex","Tant que l’exécution ChatGPT actuelle reste active, elle attend chaque nouvelle tâche Codex par intervalles bornés et reçoit directement le résultat final. Codex continue si un changement de conversation, l’arrière-plan, le verrouillage de l’écran ou une déconnexion interrompt l’attente, mais la continuation automatique n’est pas garantie dans ces états. S’applique uniquement aux nouvelles tâches.","Afficher les fils du pont dans l’app Codex","Enregistrer une conversation et l’ouvrir dans l’application Codex sont deux fonctions distinctes. L’ouverture exige l’accès au stockage d’origine et la libération de la connexion d’écriture. Le stockage Bridge n’est pas partagé automatiquement avec l’application.","Ne pas afficher automatiquement","Les paramètres ont changé ailleurs. Les dernières valeurs ont été chargées ; vérifiez-les puis enregistrez à nouveau.","Enregistrer","Réessayer de charger les modèles","Rétablir les valeurs générales","Rétablit l’accès, le modèle, la visibilité des fils Codex, l’interface et la simultanéité. Les projets, leur ordre et l’historique des descriptions des modèles sont conservés.","Enregistrement…","Enregistré.","Enregistré et actif. Ce déploiement a aussi modifié le contrat statique des outils ; actualisez une fois la connexion du mode développeur de ChatGPT pour l’appliquer.","Nouvelle tentative de chargement des modèles…","Liste des modèles chargée.","Restauration…","Les valeurs générales ont été rétablies. Les projets ont été conservés.","L’outil de paramètres a renvoyé une réponse non valide.","Ces paramètres sont partagés par toutes les conversations utilisant cette instance du pont ; ils ne sont pas enregistrés par compte ChatGPT. La politique de sécurité du pont ne peut pas être modifiée ici.","Le catalogue de modèles n’a pas pu être actualisé. Le dernier catalogue correctement vérifié est affiché temporairement.","Le catalogue de modèles est indisponible. Rétablissez l’accès au backend et relancez la recherche.","CODEX_MCP_BRIDGE_ROOTS est une ancienne restriction de compatibilité. Supprimez-la pour gérer les dossiers de projet uniquement dans les paramètres Codex.","CODEX_MCP_BRIDGE_FAST_RETURN_MS est retiré et ignoré. Les tâches Codex répondent toujours après une admission asynchrone durable.","CODEX_MCP_BRIDGE_UPSTREAM_TIMEOUT_MS est retiré et ignoré. L’exécution de Codex n’a pas de limite de temps ; utilisez l’arrêt forcé supervisé si nécessaire.","CODEX_MCP_BRIDGE_DEFAULT_SESSION_MODE est retiré et ignoré. Chaque Activity gère sa propre sélection de session.","CODEX_MCP_BRIDGE_AUTO_RESUME_TTL_MS est retiré et ignoré. La poursuite du même fil Activity n’a pas de limite d’ancienneté.","Les anciens identifiants de projet et alias par défaut n’ont pas été migrés. Enregistrez les projets par leur nom dans les paramètres.","La politique automatique n’avait pas de solution de repli exacte ; le modèle et l’effort configurés ont donc été enregistrés pour le cas où GPT omettrait son choix.","La valeur par défaut retirée du modèle automatique a été supprimée. GPT doit désormais choisir un modèle et un effort de raisonnement exacts pour tout nouveau travail.","Le mode d’accès complet enregistré est conservé, mais reste inactif car la politique de sécurité du pont désactive danger-full-access. La lecture seule est imposée jusqu’à l’activation de l’accès complet dans les paramètres d’exécution.","La limite de tâches simultanées enregistrée a été réduite au maximum actuel du pont.","Le projet enregistré « {project} » est indisponible et ne peut pas accepter de nouveau travail.","L’ancienne préférence limitée au modèle « {model} » reste active. L’effort exact par défaut provient du catalogue du backend et le mode rapide reste un réglage distinct.","L’ancienne politique automatique ne contient pas de solution de repli exacte enregistrée. La valeur par défaut du catalogue du backend reste utilisée jusqu’à l’enregistrement d’un modèle et d’un effort par défaut.","La politique de modèle enregistrée est incompatible avec le catalogue ou les contraintes actuelles. Vérifiez-la et enregistrez une sélection valide{codeSuffix}.","Un avertissement du pont nécessite votre attention. Consultez les diagnostics du pont pour plus de détails.","Nettoyage du projet en attente","Les anciennes inscriptions supprimées nécessitent un nettoyage confirmé. Réessayez avant de réinscrire le dossier.","Ce dossier contient une tâche active ou un nettoyage inachevé. Terminez ou réessayez le nettoyage.","Le nettoyage n’est pas confirmé. Réessayez avant de supprimer l’inscription.","Stockage des conversations","Conserver après redémarrage","En mémoire uniquement","Vitesse de traitement","Conserver le comportement précédent (effacer la vitesse de conversation)","Conserver Fast précédent (conversation)","Hériter de la vitesse de conversation","Standard","Fast","Ultrafast","Vitesse enregistrée inconnue : {value}","Les changements de vitesse s’appliquent aux nouveaux travaux. Les modes plus rapides peuvent modifier l’utilisation ou les frais. Ultrafast apparaît uniquement après confirmation de l’accès du compte et de l’espace de travail.","Choisissez une installation Codex compatible pour activer Standard et les autres vitesses.","L’accès à Ultrafast ne peut pas être confirmé actuellement. Votre choix est conservé ; choisissez une autre vitesse pour démarrer un nouveau travail.","Choisir une vitesse","Le réglage actuel est conservé jusqu’à ce que vous choisissiez une vitesse.","Niveaux de raisonnement à utiliser","Les niveaux sélectionnés s’appliquent à tous les modèles sélectionnés qui les prennent en charge.","{models} modèles · {count} combinaisons exécutables","Afficher tous les modèles","Aucun modèle n’est actuellement autorisé. Affichez tous les modèles pour consulter leurs descriptions.","Sélectionnez des modèles pour afficher leurs niveaux de raisonnement disponibles.","{model} ne prend pas en charge {efforts} ; ces niveaux de raisonnement ne seront pas appliqués."],"de":["Beendete Fehler bleiben ohne Bestätigungspflicht im Verlauf. Die Bridge führt sichere Wiederherstellungen aus und protokolliert geprüfte Ergebnisse. Aktive Arbeit, nicht zugestellte Ergebnisse, Codex-Gespräche und Projektdateien bleiben erhalten.","Probleme können während der Aufbewahrungsdauer geprüft werden. Die Bestätigung ändert das Fehlerergebnis nicht. Aktive Arbeit, nicht zugestellte Ergebnisse, Codex-Gespräche und Projektdateien bleiben erhalten.","Aufbewahrung des Verlaufs","Aufbewahrungsdauer","{days} Tage","Unbegrenzt behalten","Beendete Ausführungen werden nach {days} Tagen automatisch bereinigt.","Der Verlauf wird unbegrenzt aufbewahrt.","Fehler und Unterbrechungen müssen 7 Tage lang geprüft werden. Bestätigte Einträge werden nicht mehr als Probleme gezählt. Aktive Arbeit, nicht zugestellte Ergebnisse, Codex-Gespräche und Projektdateien bleiben erhalten.","Letzte Bereinigung: {time} · {count} Ausführungen","Bestätigen","Gestartet {relative}","Wird geladen…","Aktualisieren","Abbrechen","Bestätigen","Die Anfrage ist fehlgeschlagen.","Die Anfrage ist fehlgeschlagen ({code}).","Einige Details konnten nicht aktualisiert werden. Möglicherweise werden die zuletzt geprüften Werte angezeigt.","Codex-Bridge-Einstellungen","Für alle Unterhaltungen mit dieser Bridge-Verbindung gemeinsam.","Zugriffsstrategie","Immer schreibgeschützt","Bridge-Standard","Immer Vollzugriff","Jede neue Aufgabe wird auf schreibgeschützt festgelegt.","Neue Aufgaben verwenden die in der Bridge festgelegten Standardzugriffsrechte.","Jede neue Aufgabe wird auf danger-full-access festgelegt.","Vollzugriff führt Codex mit den Datei- und Netzwerkrechten dieses macOS-Benutzers aus. Der Projektordner legt nur den Arbeitsbeginn fest und ist keine Betriebssystem-Isolation.","Ausführungsmodellrichtlinie","Fest","Automatische Auswahl","Ultra-Reasoning zulassen","Ultra umfasst automatische Aufgabendelegation. Bei Deaktivierung wird Ultra aus den ausführbaren Optionen für GPT ausgeschlossen, auch aus gespeicherten Auswahlen. Diese Einstellung steuert keine anderen Reasoning-Stufen oder Agentenfunktionen.","bei deaktiviertem Ultra nicht verfügbar","Ultra ist deaktiviert. Wählen Sie eine andere Reasoning-Stufe für das feste Modell.","Bei deaktiviertem Ultra ist keine ausgewählte Kombination aus Modell und Reasoning ausführbar. Gespeicherte Auswahlen bleiben erhalten. Wählen Sie eine andere verfügbare Stufe, um Aufgaben auszuführen.","Modellbeschreibungen","GPT verwendet diese Beschreibungen, um im automatischen Modus ein Modell auszuwählen.","Offizielle Beschreibung","Eigene Beschreibung","Bearbeiten","Beschreibung speichern","Offizielle Beschreibung wiederherstellen","Offizielle Beschreibung anzeigen","Es ist keine offizielle Beschreibung verfügbar.","Dieses Modell fehlt im aktuellen Katalog. Gespeicherte Beschreibungen und Versionen bleiben erhalten.","Modellbeschreibung gespeichert.","Die offizielle Beschreibung wird verwendet.","Maximal 2.000 Zeichen. Leer lassen, um die offizielle Beschreibung zu verwenden.","Die Einstellungen wurden an anderer Stelle geändert. Ihr Text bleibt erhalten. Prüfen Sie die gespeicherte Beschreibung und speichern Sie erneut.","Die Beschreibung darf höchstens 2.000 Zeichen enthalten.","Beschreibung","Versionsverlauf","Versionen werden geladen…","Noch keine Versionen gespeichert.","Importierter gespeicherter Wert","Version","Gespeicherte Version","Aktuelle Beschreibung","Diese Version anwenden","Ältere Versionen anzeigen","Vorherige Version angewendet.","Standardmodell","Codex-Standardmodell","Aus der installierten Codex CLI geladen.","derzeit gespeichert","Standardaufwand","Standardaufwand des Modells","Es werden nur vom gewählten Modell unterstützte Werte angezeigt.","Eine neue Reasoning-Stufe aus dem aktuellen Codex-Modellkatalog.","Die gespeicherte Reasoning-Stufe wird nicht mehr unterstützt. Empfohlener Modellstandard:","Schnellste Antworten mit nur dem nötigen Reasoning.","Schnelle Antworten mit leichtem Reasoning.","Ausgewogenes Verhältnis von Reasoning-Tiefe und Antwortzeit.","Tiefere Prüfung komplexer Aufgaben mit längerer Antwortzeit.","Sehr tiefes Reasoning für schwierige Aufgaben; Antworten können deutlich länger dauern.","Maximale verfügbare Reasoning-Tiefe für anspruchsvolle Aufgaben.","Erweitertes Reasoning und Delegation für besonders anspruchsvolle Aufgaben.","Dienststufe","Standardstufe des Backends","Schnellmodus (Fast)","Führt unterstützte Modelle schneller aus. Modell und Denkstufe bleiben gleich; Verbrauch oder Kosten können steigen.","Diese genaue Auswahl wird für Codex-Turns erzwungen, die nach dem Speichern angenommen werden. Ein bereits aktiver Turn behält die bei der Annahme getroffene Entscheidung.","Auswahlbereich für GPT","Alle verfügbaren Modelle und Reasoning-Stufen","Nur selbst gewählte Modelle und Reasoning-Stufen","Wählen Sie zuerst die Modelle und dann die zulässigen Reasoning-Stufen für jedes Modell aus.","Zu verwendende Modelle","Reasoning-Stufen nach ausgewähltem Modell","Alle","Einige Reasoning-Stufen sind ausgewählt.","Zusätzliche Service-Tier-Varianten","Ausgewählte Kombinationen: {count}","Standardauswahl, wenn GPT nichts auswählt","Standardmodell, wenn GPT nicht auswählt","Standard-Reasoning-Stufe, wenn GPT nicht auswählt","Codex-Standard verwenden, wenn GPT nicht auswählt","GPT muss für jede neue Activity, jeden neuen Agent oder fresh context ein exaktes Modell und eine Reasoning-Stufe aus diesem Bereich angeben. continue/fork übernimmt bei Auslassung den beibehaltenen Thread. Schnellmodus wird separat angewendet.","Modellkatalog gültig","Modellkatalog verwendet die letzten gültigen Daten","Modellkatalog nicht verfügbar","Wählen Sie ein genaues Modell und eine Denkstufe aus.","Wählen Sie mindestens eine erlaubte genaue Kombination aus.","Wählen Sie eine gemeinsame Denkstufe, die {model} unterstützt.","Projekte","Registrieren Sie die Ordner, in denen Codex die Arbeit beginnen darf. Sie können mehrere unabhängige Orte auf diesem PC hinzufügen; interne IDs werden automatisch verwaltet.","Von der Bridge erlaubte Stammordner","Der reale Projektpfad muss innerhalb einer dieser Sicherheitsgrenzen liegen. Ein Projekt erweitert sie nicht.","Projekt hinzufügen","Erstes Projekt registrieren","Registrieren Sie zuerst ein Projekt. Codex benötigt einen Startordner; Sie können mehrere Ordner an verschiedenen Orten dieses PCs hinzufügen.","Projektname","Absoluter Ordner","Verfügbar","Wiederherstellung nötig","Neu","Archivieren","Wiederherstellen","Entfernen","Löschen","Löschen abbrechen","Beim Speichern werden Registrierung, Bridge-Sitzungen, Zuweisungen und Ergebnisse gelöscht. Ordner, Dateien, Git und ursprüngliche Codex/ChatGPT-Gespräche bleiben erhalten.","Archiviert","Projektnutzung wird beendet…","Archivierung ungeklärt. Bereinigung erneut versuchen.","Archivierung wiederholen","Speichern Sie, um dieses Projekt zu archivieren.","Speichern Sie, um dieses Projekt wiederherzustellen.","Speichern Sie, um diese Projektregistrierung zu löschen.","Geben Sie 1–120 druckbare Unicode-Zeichen als Anzeigename ein.","Geben Sie den absoluten Pfad eines vorhandenen Ordners ein.","Ein anderes aktives Projekt verwendet diesen Ordner bereits.","Korrigieren oder archivieren Sie wiederherzustellende Projekte vor dem Speichern.","Es können höchstens 100 Projekte registriert werden.","Prüfen Sie den Bereich Projekte und korrigieren Sie die hervorgehobenen Werte.","Oberflächensprache","Automatisch","Automatisch folgt der Sprache der Host-Anwendung.","Maximale parallele Jobs","Experimentell","Experimental","Codex-Ergebnisse direkt empfangen","Solange der aktuelle ChatGPT-Lauf aktiv bleibt, wartet er in begrenzten Intervallen auf jeden neuen Codex-Job und empfängt das Endergebnis direkt. Codex läuft weiter, wenn ein Gesprächswechsel, der Hintergrund, die Bildschirmsperre oder ein Verbindungsabbruch das Warten unterbricht; eine automatische Fortsetzung ist in diesen Zuständen jedoch nicht garantiert. Gilt nur für neue Jobs.","Bridge-Threads in der Codex-App anzeigen","Das Speichern und Öffnen eines Gesprächs in der Codex-App sind getrennte Funktionen. Zum Öffnen sind der ursprüngliche Speicher und die Freigabe der Schreibverbindung erforderlich. Bridge-Speicher wird nicht automatisch mit der App geteilt.","Nicht automatisch anzeigen","Die Einstellungen wurden an anderer Stelle geändert. Die neuesten Werte wurden geladen; bitte prüfen und erneut speichern.","Einstellungen speichern","Laden der Modelle erneut versuchen","Allgemeine Standardwerte wiederherstellen","Setzt Zugriff, Modell, Codex-Thread-Sichtbarkeit, Oberfläche und Parallelität zurück. Projekte, Reihenfolge und der Versionsverlauf der Modellbeschreibungen bleiben erhalten.","Wird gespeichert…","Gespeichert.","Gespeichert und aktiv. Diese Bereitstellung hat auch den statischen Toolvertrag geändert; aktualisieren Sie die ChatGPT-Entwicklermodus-Verbindung einmal, um ihn zu übernehmen.","Modelle werden erneut geladen…","Modellliste geladen.","Wird wiederhergestellt…","Allgemeine Standardwerte wurden wiederhergestellt. Projekte wurden beibehalten.","Das Einstellungswerkzeug hat eine ungültige Antwort zurückgegeben.","Diese Einstellungen werden von allen Unterhaltungen gemeinsam genutzt, die diese Bridge-Instanz verwenden; sie werden nicht pro ChatGPT-Konto gespeichert. Die Sicherheitsrichtlinie der Bridge kann hier nicht geändert werden.","Der Modellkatalog konnte nicht aktualisiert werden. Vorübergehend wird der zuletzt erfolgreich geprüfte Katalog angezeigt.","Der Modellkatalog ist nicht verfügbar. Stellen Sie den Backend-Zugriff wieder her und versuchen Sie die Modellsuche erneut.","CODEX_MCP_BRIDGE_ROOTS ist eine alte Kompatibilitätsbeschränkung. Entfernen Sie sie, um Projektordner ausschließlich in den Codex-Einstellungen zu verwalten.","CODEX_MCP_BRIDGE_FAST_RETURN_MS wurde eingestellt und wird ignoriert. Codex-Tasks antworten immer nach dauerhafter asynchroner Annahme.","CODEX_MCP_BRIDGE_UPSTREAM_TIMEOUT_MS wurde eingestellt und wird ignoriert. Die Codex-Ausführung hat kein Zeitlimit; verwenden Sie bei Bedarf einen überwachten Zwangsstopp.","CODEX_MCP_BRIDGE_DEFAULT_SESSION_MODE wurde eingestellt und wird ignoriert. Jede Activity verwaltet ihre eigene Sitzungsauswahl.","CODEX_MCP_BRIDGE_AUTO_RESUME_TTL_MS wurde eingestellt und wird ignoriert. Die Fortsetzung desselben Activity-Threads hat keine Altersgrenze.","Alte Projekt-IDs und Standardaliase wurden nicht migriert. Registrieren Sie Projekte in den Einstellungen nach Namen.","Der automatischen Modellrichtlinie fehlte eine genaue Ausweichoption. Daher wurden das konfigurierte Modell und die Denkstufe als Ausweichwert gespeichert, falls GPT keine Auswahl trifft.","Der eingestellte Standard für die automatische Modellauswahl wurde entfernt. GPT muss für neue Arbeit nun ein exaktes Modell und eine Reasoning-Stufe wählen.","Der gespeicherte Vollzugriffsmodus bleibt erhalten, ist aber inaktiv, da die Sicherheitsrichtlinie der Bridge danger-full-access deaktiviert. Bis Vollzugriff in den Laufzeiteinstellungen aktiviert wird, gilt der schreibgeschützte Modus.","Die gespeicherte Grenze gleichzeitiger Aufgaben wurde auf das aktuelle Maximum der Bridge reduziert.","Das gespeicherte Projekt „{project}“ ist nicht verfügbar und kann keine neue Arbeit annehmen.","Die alte reine Modelleinstellung „{model}“ ist weiterhin aktiv. Die genaue Standard-Denkstufe stammt aus dem Backend-Katalog; Schnellmodus bleibt eine separate Einstellung.","Die alte automatische Modellrichtlinie hat keine genaue gespeicherte Ausweichoption. Der Standard des Backend-Katalogs bleibt aktiv, bis in den Einstellungen ein Standardmodell und eine Denkstufe gespeichert werden.","Die gespeicherte Modellrichtlinie ist mit dem aktuellen Katalog oder den Einschränkungen nicht kompatibel. Prüfen Sie sie und speichern Sie eine gültige Auswahl{codeSuffix}.","Eine Bridge-Warnung erfordert Aufmerksamkeit. Weitere Informationen finden Sie in der Bridge-Diagnose.","Projektbereinigung ausstehend","Früher gelöschte Registrierungen benötigen eine bestätigte Bereinigung. Wiederholen Sie diese vor der erneuten Registrierung.","Dieser Ordner enthält aktive Arbeit oder eine unvollständige Bereinigung. Beenden oder wiederholen Sie diese zuerst.","Die Bereinigung ist nicht bestätigt. Wiederholen Sie diese vor dem Löschen der Registrierung.","Gesprächsspeicherung","Nach Neustart behalten","Nur im Speicher","Verarbeitungsgeschwindigkeit","Bisheriges Verhalten beibehalten (Gesprächsgeschwindigkeit löschen)","Bisheriges Fast beibehalten (Gespräch)","Gesprächsgeschwindigkeit übernehmen","Standard","Fast","Ultrafast","Unbekannte gespeicherte Geschwindigkeit: {value}","Geschwindigkeitsänderungen gelten für neue Aufgaben. Schnellere Modi können Verbrauch oder Kosten beeinflussen. Ultrafast erscheint nur bei bestätigtem Zugriff für Konto und Arbeitsbereich.","Wähle eine kompatible Codex-Installation, um Standard und weitere Geschwindigkeiten zu aktivieren.","Der Ultrafast-Zugriff kann derzeit nicht bestätigt werden. Deine gespeicherte Auswahl bleibt erhalten; wähle für neue Aufgaben eine andere Geschwindigkeit.","Geschwindigkeit wählen","Die aktuelle Einstellung bleibt erhalten, bis Sie eine Geschwindigkeit wählen.","Zu verwendende Denkstufen","Ausgewählte Denkstufen gelten für alle ausgewählten Modelle, die sie unterstützen.","{models} Modelle · {count} ausführbare Kombinationen","Alle Modelle anzeigen","Derzeit sind keine Modelle erlaubt. Zeigen Sie alle Modelle an, um ihre Beschreibungen zu sehen.","Wählen Sie Modelle aus, um ihre verfügbaren Denkstufen zu sehen.","{model} unterstützt {efforts} nicht; diese Denkstufen werden nicht angewendet."],"pt":["As falhas terminadas são conservadas sem revisão obrigatória. A ponte efetua recuperações seguras e regista resultados verificados. São preservados o trabalho ativo, os resultados não entregues, as conversas do Codex e os ficheiros do projeto.","Os problemas podem ser revistos durante o período de retenção. A
