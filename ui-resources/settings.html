l para executar tarefas.","Descrições dos modelos","O GPT usa estas descrições para escolher um modelo no modo automático.","Descrição oficial","Descrição do usuário","Editar","Salvar descrição","Restaurar descrição oficial","Ver descrição oficial","Nenhuma descrição oficial está disponível.","Este modelo não está no catálogo atual. Descrições e versões salvas são mantidas.","Descrição do modelo salva.","A descrição oficial está em uso.","Até 2.000 caracteres. Deixe em branco para usar a descrição oficial.","As configurações mudaram em outra tela. Seu texto foi mantido. Confira a descrição salva e salve novamente.","A descrição deve ter no máximo 2.000 caracteres.","Descrição","Histórico de versões","Carregando versões…","Ainda não há versões salvas.","Valor salvo importado","Versão","Versão salva","Descrição atual","Aplicar esta versão","Mostrar versões anteriores","Versão anterior aplicada.","Modelo padrão","Modelo padrão do Codex","Carregado da CLI do Codex instalada.","salvo atualmente","Esforço padrão","Esforço padrão do modelo","Somente valores compatíveis com o modelo selecionado são exibidos.","Um novo nível de raciocínio fornecido pelo catálogo atual do Codex.","O nível salvo não é mais compatível. Padrão sugerido do modelo:","Resposta mais rápida usando apenas o raciocínio essencial.","Respostas rápidas com raciocínio leve.","Equilibra profundidade de raciocínio e tempo de resposta.","Revisão mais profunda de tarefas complexas, com maior tempo de resposta.","Raciocínio muito profundo para tarefas difíceis; a resposta pode demorar bem mais.","Profundidade máxima de raciocínio para tarefas exigentes.","Raciocínio ampliado e delegação para as tarefas mais exigentes.","Nível de serviço","Nível padrão do backend","Modo rápido (Fast)","Executa os modelos compatíveis mais rapidamente. O modelo e o nível de raciocínio permanecem iguais; o consumo ou o custo podem aumentar.","Esta seleção exata é aplicada aos turnos do Codex aceitos após salvar. Um turno já ativo mantém a decisão tomada na admissão.","Opções disponíveis para o GPT","Todos os modelos e níveis disponíveis","Somente os modelos e níveis escolhidos","Selecione primeiro os modelos e depois os níveis de raciocínio permitidos para cada um.","Modelos a usar","Níveis de raciocínio por modelo selecionado","Todos","Alguns níveis estão selecionados.","Variantes adicionais de nível de serviço","Combinações selecionadas: {count}","Seleção padrão quando o GPT não escolher","Modelo padrão quando o GPT não escolher","Nível padrão quando o GPT não escolher","Usar o padrão do Codex quando o GPT não escolher","O GPT deve indicar um modelo e um nível de raciocínio exatos deste intervalo para cada Activity, Agent ou contexto novo. continue/fork herda o thread retido quando a seleção é omitida. A ponte aplica o modo rápido separadamente.","Catálogo de modelos válido","O catálogo usa os últimos dados válidos","Catálogo de modelos indisponível","Escolha um modelo e um nível de raciocínio exatos.","Selecione pelo menos uma combinação exata permitida.","Escolha um nível de raciocínio comum compatível com {model}.","Projetos","Registre as pastas onde o Codex pode começar a trabalhar. Você pode adicionar vários locais independentes deste PC; os IDs internos são gerenciados automaticamente.","Raízes permitidas pela ponte","O caminho real de cada projeto deve ficar dentro de um destes limites de segurança. Registrar um projeto não os amplia.","Adicionar projeto","Registrar primeiro projeto","Registre primeiro um projeto. O Codex precisa de uma pasta onde começar; você pode adicionar várias pastas de locais diferentes deste PC.","Nome do projeto","Pasta absoluta","Disponível","Precisa de recuperação","Novo","Arquivar","Restaurar","Remover","Excluir","Cancelar exclusão","Ao salvar, o registro, as sessões, as atribuições e os resultados da ponte serão removidos. Pastas, arquivos, Git e conversas originais do Codex/ChatGPT serão preservados.","Arquivado","Finalizando o uso do projeto…","Arquivamento não resolvido. Tente a limpeza novamente.","Tentar arquivar novamente","Salve para arquivar este projeto.","Salve para restaurar este projeto.","Salve para excluir este registro de projeto.","Digite de 1 a 120 caracteres Unicode imprimíveis para o rótulo.","Digite o caminho absoluto de uma pasta existente.","Outro projeto ativo já utiliza esta pasta.","Corrija ou arquive os projetos que precisam de recuperação antes de salvar.","No máximo 100 projetos podem ser registrados.","Revise a seção Projetos e corrija os valores destacados.","Idioma da interface","Automático","O modo automático segue o idioma do aplicativo host.","Máximo de trabalhos simultâneos","Experimental","Experimental","Receber resultados do Codex diretamente","Enquanto a execução atual do ChatGPT permanecer ativa, ela aguarda cada novo trabalho do Codex em intervalos limitados e recebe diretamente o resultado final. O Codex continua executando se a troca de conversa, o segundo plano, o bloqueio de tela ou uma desconexão interromperem a espera, mas a continuação automática não é garantida nesses estados. Aplica-se apenas a novos trabalhos.","Mostrar threads da ponte no app Codex","Salvar uma conversa e abri-la no aplicativo Codex são funções separadas. Abrir exige acesso ao armazenamento original e liberar a conexão de escrita. O armazenamento do Bridge não é compartilhado automaticamente com o aplicativo.","Não mostrar automaticamente","As configurações foram alteradas em outro local. Os valores mais recentes foram carregados; revise e salve novamente.","Salvar configurações","Tentar carregar os modelos novamente","Restaurar padrões gerais","Restaura acesso, modelo, visibilidade de threads no Codex, interface e concorrência. Projetos, ordem e histórico das descrições dos modelos são mantidos.","Salvando…","Salvo.","Salvo e ativo. Esta implantação também alterou o contrato estático das ferramentas; atualize uma vez a conexão do modo de desenvolvedor do ChatGPT para aplicá-lo.","Tentando carregar os modelos novamente…","Lista de modelos carregada.","Restaurando…","Os padrões gerais foram restaurados. Os projetos foram mantidos.","A ferramenta de configurações retornou uma resposta inválida.","Estas configurações são compartilhadas por todas as conversas que usam esta instância da ponte; não são salvas por conta do ChatGPT. A política de segurança da ponte não pode ser alterada aqui.","Não foi possível atualizar o catálogo de modelos. O último catálogo verificado com sucesso está sendo exibido temporariamente.","O catálogo de modelos não está disponível. Restaure o acesso ao backend e tente consultar os modelos novamente.","CODEX_MCP_BRIDGE_ROOTS é uma restrição de compatibilidade antiga. Remova-a para gerenciar as pastas dos projetos somente nas configurações do Codex.","CODEX_MCP_BRIDGE_FAST_RETURN_MS foi descontinuado e é ignorado. As tarefas do Codex sempre respondem após admissão assíncrona durável.","CODEX_MCP_BRIDGE_UPSTREAM_TIMEOUT_MS foi descontinuado e é ignorado. A execução do Codex não tem limite de tempo; use a interrupção forçada supervisionada quando necessário.","CODEX_MCP_BRIDGE_DEFAULT_SESSION_MODE foi descontinuado e é ignorado. Cada Activity gerencia sua própria seleção de sessão.","CODEX_MCP_BRIDGE_AUTO_RESUME_TTL_MS foi descontinuado e é ignorado. Continuar a mesma thread de Activity não tem limite de idade.","IDs de projeto e aliases padrão antigos não foram migrados. Registre os projetos por nome em Configurações.","A política automática não tinha uma alternativa exata; por isso, o modelo e o esforço configurados foram salvos para quando o GPT omitir a seleção.","O padrão descontinuado do modelo automático foi removido. Agora o GPT deve escolher um modelo e um nível de raciocínio exatos para novos trabalhos.","O modo de acesso total salvo é preservado, mas permanece inativo porque a política de segurança da ponte desativa danger-full-access. O modo somente leitura é aplicado até que o acesso total seja habilitado nas configurações de execução.","O limite salvo de tarefas simultâneas foi reduzido ao máximo atual da ponte.","O projeto salvo “{project}” não está disponível e não pode aceitar novos trabalhos.","A preferência antiga somente de modelo “{model}” continua ativa. O esforço padrão exato vem do catálogo do backend e o modo rápido continua sendo uma preferência separada.","A política automática antiga não tem uma alternativa exata salva. O padrão do catálogo do backend continuará em uso até que um modelo e esforço padrão sejam salvos em Configurações.","A política de modelo salva é incompatível com o catálogo ou as restrições atuais. Revise-a e salve uma seleção válida{codeSuffix}.","Há um aviso da ponte que requer atenção. Consulte os diagnósticos da ponte para obter detalhes.","Limpeza do projeto pendente","Registros excluídos precisam de limpeza confirmada. Tente novamente antes de registrar a pasta outra vez.","Esta pasta tem trabalho ativo ou limpeza incompleta. Conclua ou tente a limpeza novamente.","A limpeza não foi confirmada. Tente novamente antes de excluir o registro.","Armazenamento de conversas","Manter após reiniciar","Somente na memória","Velocidade de processamento","Manter comportamento anterior (limpar velocidade da conversa)","Manter Fast anterior (conversa)","Herdar velocidade da conversa","Standard","Fast","Ultrafast","Velocidade salva desconhecida: {value}","As mudanças de velocidade se aplicam aos novos trabalhos. Os modos mais rápidos podem afetar o uso ou os custos. Ultrafast só aparece quando o acesso da conta e do espaço de trabalho é confirmado.","Escolha uma instalação compatível do Codex para ativar Standard e outras velocidades.","Não é possível confirmar o acesso ao Ultrafast no momento. A escolha salva é mantida; selecione outra velocidade para iniciar um novo trabalho.","Escolher velocidade","A configuração atual é mantida até você escolher uma velocidade.","Níveis de raciocínio a usar","Os níveis selecionados se aplicam a todos os modelos selecionados que     function uiBridgeErrorMessage(value,fallback="Something went wrong.",visited=new Set){if(typeof value==="string"){const message=value.trim();return(message==="[object Object]"?"":message)||fallback}if(typeof value==="number"||typeof value==="boolean")return String(value);if(value===null||typeof value!=="object"||visited.has(value))return fallback;visited.add(value);const record=value;const code=typeof record.code==="string"?record.code.trim():"";let message="";for(const key of["message","error","data","cause","detail","details"]){message=uiBridgeErrorMessage(record[key],"",visited);if(message)break}if(!message&&Array.isArray(record.content)){for(const item of record.content){if(item&&typeof item==="object"&&item.type==="text"&&typeof item.text==="string"){message=uiBridgeErrorMessage(item.text,"",visited);if(message)break}}}if(!message){try{const serialized=JSON.stringify(value);if(serialized&&serialized!=="{}")message=serialized}catch{}}if(code&&message&&!message.includes(code))return`${code}: ${message}`;return message||code||fallback}
    function resolveHostUiLocaleTag(exposedLocale,metadata,fallbackLocale){const record=metadata&&typeof metadata==="object"?metadata:null;const exposed=typeof exposedLocale==="string"&&exposedLocale.trim()?exposedLocale.trim():null;if(exposed)return exposed;const hostValue=record?.hostLocale;const host=typeof hostValue==="string"&&hostValue.trim()?hostValue.trim():null;if(host)return host;const legacyHostValue=record?.["webplus/i18n"];const legacyHost=typeof legacyHostValue==="string"&&legacyHostValue.trim()?legacyHostValue.trim():null;if(legacyHost)return legacyHost;if(record&&!Object.prototype.hasOwnProperty.call(record,"hostLocale")){const legacyOpenAiLocaleValue=record["openai/locale"];const legacyOpenAiLocale=typeof legacyOpenAiLocaleValue==="string"&&legacyOpenAiLocaleValue.trim()?legacyOpenAiLocaleValue.trim():null;if(legacyOpenAiLocale)return legacyOpenAiLocale}return typeof fallbackLocale==="string"&&fallbackLocale.trim()?fallbackLocale.trim():"en"}
    function uiJsonTextIsWellFormed(value){const seen=new Set;const candidates=[value];while(candidates.length>0){const candidate=candidates.pop();if(typeof candidate==="string"){for(let index=0;index<candidate.length;index+=1){const codeUnit=candidate.charCodeAt(index);if(codeUnit>=55296&&codeUnit<=56319){const following=candidate.charCodeAt(index+1);if(following>=56320&&following<=57343){index+=1;continue}return false}if(codeUnit>=56320&&codeUnit<=57343)return false}continue}if(!candidate||typeof candidate!=="object")continue;if(seen.has(candidate))continue;if(seen.size>=1e4)return false;seen.add(candidate);try{if(Array.isArray(candidate)){for(const entry of candidate)candidates.push(entry);continue}for(const[key,entry]of Object.entries(candidate)){for(let index=0;index<key.length;index+=1){const codeUnit=key.charCodeAt(index);if(codeUnit>=55296&&codeUnit<=56319){const following=key.charCodeAt(index+1);if(following>=56320&&following<=57343){index+=1;continue}return false}if(codeUnit>=56320&&codeUnit<=57343)return false}candidates.push(entry)}}catch{return false}}return true}
    function parseUiJsonTextStrict(value){if(!uiJsonTextIsWellFormed(value))return undefined;try{const parsed=JSON.parse(value);return uiJsonTextIsWellFormed(parsed)?parsed:undefined}catch{return undefined}}
    function normalizeHostToolResult(value){const queue=[value];const seen=new Set;let fallback=uiJsonTextIsWellFormed(value)?value:undefined;while(queue.length>0&&seen.size<16){let current=queue.shift();if(typeof current==="string"){current=parseUiJsonTextStrict(current)}if(!uiJsonTextIsWellFormed(current))continue;if(!current||typeof current!=="object")continue;if(seen.has(current))continue;seen.add(current);if(fallback===undefined)fallback=current;const record=current;if(Object.prototype.hasOwnProperty.call(record,"_meta")||Object.prototype.hasOwnProperty.call(record,"structuredContent")||Object.prototype.hasOwnProperty.call(record,"content")||Object.prototype.hasOwnProperty.call(record,"isError")){return record}for(const key of["mcp_tool_result","call_tool_result","result","tool_result"]){if(Object.prototype.hasOwnProperty.call(record,key))queue.push(record[key])}}return fallback}
    function hostToolResultMetadata(value){const normalized=normalizeHostToolResult(value);if(!normalized||typeof normalized!=="object")return{};const record=normalized;const metadata=record._meta;return metadata&&typeof metadata==="object"&&!Array.isArray(metadata)?metadata:record}
    function withUiToolCallTimeout(attempt,timeoutMs,timeoutMessage,timeoutCode="MCP_TOOL_CALL_DISPATCH_TIMEOUT"){return new Promise((resolve,reject)=>{let settled=false;const timer=setTimeout(()=>{if(settled)return;settled=true;reject(Object.assign(new Error(timeoutMessage),{code:timeoutCode}))},timeoutMs);Promise.resolve().then(attempt).then(value=>{if(settled)return;settled=true;clearTimeout(timer);resolve(value)},error=>{if(settled)return;settled=true;clearTimeout(timer);reject(error)})})}
    function settingsSpeedChoices(available){return["standard","fast","ultrafast"].filter(speed=>available?.includes(speed))}

    window.addEventListener("openai:set_globals",(event)=>{const globals=event.detail&&event.detail.globals,metadata=globals&&globals.toolResponseMetadata;hostLocaleTag=resolveHostUiLocaleTag(globals&&globals.locale,metadata,hostLocaleTag);if(localePreference==="auto")setLocale(hostLocaleTag);});
    window.addEventListener("pagehide",()=>{for(const [id,request] of pendingRequests){window.parent.postMessage({jsonrpc:"2.0",method:"notifications/cancelled",params:{requestId:id,reason:"Settings card unmounted"}},"*");request.reject(new Error("Settings card unmounted"));}pendingRequests.clear();});
    elements.access.addEventListener("change",updateAccessNotice);
    elements.priority.addEventListener("change",()=>{processingSpeedDirty=true;elements.speedRetained.hidden=true;});
    elements.addProject.addEventListener("click",()=>{if(projectRows().length>=100){showProjectError(t["settings.projectLimit"]);return;}const row=appendProjectRow({name:"",cwd:""});updateProjectEmptyState();row.querySelector(".project-label-input").focus();});
    elements.mode.addEventListener("change",()=>{modelPolicyDirty=true;updatePolicyControls();});
    elements.delegation.addEventListener("change",()=>{modelPolicyDirty=true;const fixed=currentFixedSelection();renderFixedSelection(fixed);renderExplicitPolicy();updatePolicyControls();});
    elements.model.addEventListener("change",()=>{modelPolicyDirty=true;renderFixedEfforts(null);updateUltraPolicyNotice();});
    elements.effort.addEventListener("change",()=>{modelPolicyDirty=true;updateEffortHelper();elements.effortCompatibility.textContent="";updateUltraPolicyNotice();});
    elements.allowedScope.addEventListener("change",()=>{modelPolicyDirty=true;updatePolicyControls();renderExplicitPolicy();});
    elements.allowedModels.addEventListener("change",(event)=>{const target=event.target;if(!(target instanceof HTMLInputElement)||target.dataset.action!=="model")return;modelPolicyDirty=true;const modelId=target.dataset.model;if(!modelId)return;if(target.checked)explicitSelectedModels.add(modelId);else explicitSelectedModels.delete(modelId);const visible=new Set(availableCommonEfforts([...explicitSelectedModels],supportedSelections()));for(const effort of explicitCommonEfforts)if(!visible.has(effort))explicitCommonEfforts.delete(effort);renderExplicitPolicy();});
    byId("show-all-model-descriptions").addEventListener("change",()=>descriptionEditor.refresh());
    elements.commonEfforts.addEventListener("change",event=>{
      const target=event.target;if(!(target instanceof HTMLInputElement)||target.dataset.action!=="common-effort")return;
      modelPolicyDirty=true;const effort=target.dataset.effort;
      if(target.checked)explicitCommonEfforts.add(effort);else explicitCommonEfforts.delete(effort);
      renderExplicitPolicy();
    });
    elements.threadPersistence.addEventListener("change",()=>{const memory=elements.threadPersistence.value==="ephemeral";if(memory)elements.codexAppThreads.checked=false;elements.codexAppThreads.disabled=memory;updateCodexAppThreadsHint();});
    elements.language.addEventListener("change",()=>{localePreference=elements.language.value;setLocale(effectiveLocaleTag());});
    elements.form.addEventListener("submit",async(event)=>{event.preventDefault();if(!view)return;const projectSettings=buildProjectSettings();if(!projectSettings||!elements.form.reportValidity())return;setBusy(true,t["settings.saving"]);try{const settings={accessStrategy:elements.access.value,showBridgeThreadsInCodexApp:elements.codexAppThreads.checked,bridgeThreadPersistence:elements.threadPersistence.value,uiLocalePreference:elements.language.value,maxConcurrentJobs:integerValue(elements.concurrency)},projectOperations=buildProjectOperations(projectSettings.projects);if(processingSpeedDirty&&settingsSpeedChoices(view.capabilities.availableProcessingSpeeds).includes(elements.priority.value))settings.processingSpeed=elements.priority.value;if(view.settings.historyRetentionDays!==undefined)settings.historyRetentionDays=Number(elements.historyRetention.value);if(projectOperations.length)settings.projectOperations=projectOperations;if(modelPolicyDirty)settings.modelPolicy=buildModelPolicy();const args={expectedSettingsRevision:view.settings.settingsRevision,expectedRegistryRevision:view.settings.registryRevision,operation:{kind:"patch",settings}};const result=await callTool("codex_update_settings",args),next=unwrap(result);render(next);setBusy(false,mutationStatus(next,t["settings.saved"]));}catch(error){await handleMutationError(error);}});
    elements.retryModels.addEventListener("click",async()=>{setBusy(true,t["settings.refreshing"]);try{const next=unwrap(await callTool("codex_ui_read",{view:"settings",refreshModels:true}));render(next);setBusy(false,mutationStatus(next,t["settings.refreshed"]));}catch(error){setBusy(false);setError(error);}});
    elements.reset.addEventListener("click",async()=>{if(!view)return;setBusy(true,t["settings.resetting"]);try{const next=unwrap(await callTool("codex_update_settings",{expectedSettingsRevision:view.settings.settingsRevision,operation:{kind:"reset"}}));descriptionEditor.reset();render(next);setBusy(false,mutationStatus(next,t["settings.resetDone"]));}catch(error){await handleMutationError(error);}});
    elements.retryLoad.addEventListener("click",()=>void loadSettings());
    standardBridgeReady=initializeStandardBridge();setLocale(localeTag);void loadSettings();
  </script>
</body>
