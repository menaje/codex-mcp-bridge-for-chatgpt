<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Codex Bridge app icon</title>
  <desc id="desc">A central orchestration core coordinating three independent project nodes.</desc>

  <!-- Full-bleed artwork. macOS applies the platform icon mask. -->
  <rect width="1024" height="1024" fill="#151816"/>

  <g fill="#35DC7A" stroke="#35DC7A">
    <!-- Three independent project nodes. -->
    <circle cx="302" cy="322" r="62" fill="none" stroke-width="32"/>
    <circle cx="722" cy="322" r="62" fill="none" stroke-width="32"/>
    <circle cx="512" cy="742" r="62" fill="none" stroke-width="32"/>

    <!-- Parallel work paths. Two beats per path preserve the original status-glyph rhythm. -->
    <circle cx="434" cy="442" r="18" stroke="none"/>
    <circle cx="385" cy="397" r="18" stroke="none"/>
    <circle cx="590" cy="442" r="18" stroke="none"/>
    <circle cx="639" cy="397" r="18" stroke="none"/>
    <circle cx="512" cy="590" r="18" stroke="none"/>
    <circle cx="512" cy="638" r="18" stroke="none"/>

    <!-- Filled core: coordination is expressed by area, projects by outlines. -->
    <rect x="478" y="478" width="68" height="68" rx="17" stroke="none" transform="rotate(45 512 512)"/>
  </g>
</svg>
